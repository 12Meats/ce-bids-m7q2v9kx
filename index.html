<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CE Billing</title>
  <meta name="theme-color" content="#041E42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Chrome deprecated the apple-prefixed form; iOS still reads only that one,
       so both are declared. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CE Billing">
  <link rel="icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      /* Cowboys navy is the one deliberate departure from the timesheet app's
         palette; everything else is identical so the two apps feel like one
         pair in the hand. */
      --color-accent: #041E42;
      --color-accent-dark: #02132b;
      --color-confirm: #15803d;
      --color-danger: #b91c1c;
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-text: #0f172a;
      --color-text-muted: #475569;
      --color-border: #cbd5e1;
      --color-warn-bg: #fef3c7;
      --color-warn-border: #f59e0b;
      --color-warn-text: #92400e;
      --color-chart-guide: #94a3b8;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --space-1: 8px;
      --space-2: 12px;
      --space-3: 16px;
      --space-4: 24px;
      --space-5: 32px;
      --font-body: 1.1rem;
      --font-lg: 1.4rem;
      /* The one number a screen exists to produce. 28px is the whole scale:
         everything big in this app is this size, so two "big" numbers on one
         screen can never quietly disagree about which of them is the answer. */
      --font-xl: 1.75rem;
      /* Height reserved at the bottom of every screen for the tab bar. */
      --tabbar-height: 64px;
      /* The notch/status-bar inset, behind a variable so a test can inject a
         real device value on a desktop browser. */
      --sai-top: env(safe-area-inset-top, 0px);
      /* The sticky top bar's height, so anything that has to stick UNDER it
         reads the same number the bar is built from rather than guessing. */
      --chrome-height: calc(56px + var(--sai-top));
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    h1, h2, h3, p { margin: 0; }

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ---------- Chrome (top bar + banners) ---------- */
    /* One sticky block rather than two independently-stuck elements: the
       banner area used to offset itself by the top bar's height, which was
       wrong by exactly the safe-area inset on a notched phone (a 21px gap of
       scrolling content showing through under the bar). Sticking the pair
       together means there is no offset to get wrong. */
    .chrome {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--color-bg);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      /* 4px padding + a 48px back button = 56px, and min-height carries the
         title-only state to the same 56px, so the chrome does not change
         height as the owner moves between screens. The inset has to be inside
         min-height or the title-only bar comes up short by exactly the notch
         (82px vs 103px on an iPhone 14 Pro). */
      min-height: var(--chrome-height);
      padding: 4px var(--space-2);
      padding-top: calc(4px + var(--sai-top));
      background: var(--color-accent);
      color: #ffffff;
    }
    .topbar[hidden] { display: none; }

    .back-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      min-width: 48px;
      min-height: 48px;
      padding: 0 10px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .back-btn:active { background: rgba(255, 255, 255, 0.18); }
    .back-btn[hidden] { display: none; }

    .topbar-title {
      flex: 1;
      min-width: 0;
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      padding-right: 48px; /* balance the back button so the title stays visually centered */
      /* A title naming the thing the screen was opened for can be as long as
         he wants to type. It trims rather than wrapping the bar to two lines. */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------- Banners ---------- */
    /* Sits directly under the top bar. Persistent banners (storage corrupt)
       stay until clearBanner(); transient ones carry a dismiss X and clear
       themselves after a few seconds. */
    /* Inside .chrome, so a failed save on a long screen is visible where the
       thumb already is rather than only at scroll-top — and without the app
       scrolling the page back to the top and losing the owner's place. */
    .banner-area {
      padding: 0 20px;
      background: var(--color-bg);
    }
    .banner-area:empty { display: none; }
    /* Padding, not a margin on the first banner: a child margin collapses out
       through the area and .chrome, which would put a 16px seam between the
       top bar and the banner block instead of inside it. */
    .banner-area:not(:empty) { padding-top: var(--space-3); }

    .banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      border-radius: 12px;
      padding: var(--space-2) var(--space-3);
      margin-bottom: var(--space-2);
      font-size: 0.95rem;
      background: var(--color-warn-bg);
      border: 1px solid var(--color-warn-border);
      color: var(--color-warn-text);
    }
    .banner-danger {
      background: rgba(185, 28, 28, 0.1);
      border-color: var(--color-danger);
      color: var(--color-danger);
    }
    .banner-ok {
      background: rgba(21, 128, 61, 0.1);
      border-color: var(--color-confirm);
      color: var(--color-confirm);
    }
    .banner-text { flex: 1; }
    /* A banner that names a place is a way to get there. Same words, same
       colour, now a real 48px target with the underline that says so. */
    .banner-go {
      min-height: 48px;
      padding: 0;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: inherit;
      font-weight: 700;
      color: inherit;
      text-align: left;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .banner-go:active { opacity: 0.6; }
    .banner-dismiss {
      min-width: 48px;
      min-height: 48px;
      border: none;
      background: transparent;
      color: inherit;
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: 10px;
    }
    .banner-dismiss:active { background: rgba(15, 23, 42, 0.1); }

    /* ---------- Screens ---------- */
    .screen[hidden] { display: none; }

    /* Scrollable content area for every real screen. Bottom padding clears
       both the tab bar and the home indicator. */
    .screen-content {
      padding: var(--space-4) 20px;
      padding-bottom: calc(var(--space-4) + var(--tabbar-height) + env(safe-area-inset-bottom));
    }

    .screen-placeholder {
      font-size: var(--font-body);
      color: var(--color-text-muted);
    }

    /* ---------- Bottom tab bar ---------- */
    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: flex;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tabbar[hidden] { display: none; }
    .tab {
      flex: 1;
      min-height: var(--tabbar-height);
      border: none;
      background: transparent;
      color: var(--color-text-muted);
      font-size: 1.05rem;
      font-weight: 600;
    }
    .tab:active { background: #eef2f7; }
    .tab-active { color: var(--color-accent); box-shadow: inset 0 3px 0 var(--color-accent); }

    /* ---------- PIN screen ---------- */
    .pin-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: var(--space-5) var(--space-4);
      padding-top: calc(var(--space-5) + var(--sai-top));
      padding-bottom: calc(var(--space-5) + env(safe-area-inset-bottom));
      gap: 28px;
      text-align: center;
    }

    .app-name {
      font-size: var(--font-xl);
      font-weight: 800;
      color: var(--color-accent);
      letter-spacing: -0.02em;
    }

    .pin-message {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--color-text-muted);
      min-height: 1.5em;
    }

    /* Shown only after three wrong tries. There is no recovery path by design
       (same policy as CE Timesheets) -- this is text, not a button. */
    .pin-hint {
      font-size: 0.95rem;
      color: var(--color-text-muted);
      max-width: 320px;
    }
    .pin-hint[hidden] { display: none; }
    .pin-cancel { min-width: 200px; }
    .pin-cancel[hidden] { display: none; }

    .pin-dots {
      display: flex;
      gap: 18px;
    }

    .dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid var(--color-accent);
      background: transparent;
      transition: background-color 0.15s ease;
    }
    .dot.filled { background: var(--color-accent); }

    @keyframes shake {
      10%, 90% { transform: translateX(-4px); }
      20%, 80% { transform: translateX(8px); }
      30%, 50%, 70% { transform: translateX(-14px); }
      40%, 60% { transform: translateX(14px); }
    }
    /* ui.js shake() puts this class on whatever element got it wrong: a form
       row, the PIN dots, the typed digits. The animation is generic and the
       two rules below only add color on top of it. */
    .shake { animation: shake 0.5s; }
    .pin-dots.shake { animation: shake 0.5s; }
    .pin-dots.shake .dot { border-color: var(--color-danger); }

    /* ---------- Keypad (shared by the PIN screen and the number panel) ---------- */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 340px;
    }

    .key {
      min-height: 68px;
      font-size: 1.6rem;
      font-weight: 600;
      border-radius: 14px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    .key:active { background: #e2e8f0; }

    .key-blank {
      visibility: hidden;
      pointer-events: none;
      border: none;
      box-shadow: none;
      background: transparent;
    }

    /* The second and last red control in the app — see .btn-danger for the
       whole rule. Inside a keypad panel and nowhere else. */
    .key-back {
      color: var(--color-danger);
      font-size: 1.4rem;
    }

    /* ---------- Shared building blocks ---------- */
    .btn {
      min-height: 48px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      padding: var(--space-2) 18px;
    }
    .btn-primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
    .btn-confirm { background: var(--color-confirm); border-color: var(--color-confirm); color: #fff; }
    /* THE RED RULE, IN FULL.
       A warning is AMBER — --color-warn-*, the colour of the nudge bands, the
       inline warnings and .caption-warn. A warning is a thing he should look
       at, not a thing that has gone wrong, and a screen that shouts in red at
       a two-week-old backup teaches him to stop reading red.
       RED PAINTS A CONTROL IN EXACTLY TWO PLACES, and tests/ui.test.js scans
       this stylesheet to keep it at two:
         1. .btn-danger — the primary button on a confirm panel, beside the
            sentence naming what is about to go. A colour asking a question.
         2. .key-back — the ⌫ key inside a keypad panel, where red is the
            keyboard convention for the key that takes a digit back and there
            is nothing else on the panel it could be confused with.
       Everything else that takes something away wears .link-btn-quiet: muted
       text, no outline, last in its strip. */
    .btn-danger { background: var(--color-danger); border-color: var(--color-danger); color: #fff; }
    /* A real second choice: "Split into tasks" beside "Next: Costs & price",
       where two identical grey blocks used to read as two ways forward. */
    .btn-outline { background: transparent; border-color: var(--color-accent); color: var(--color-accent); }
    .btn-block { display: block; width: 100%; text-align: center; }
    /* A button that is off is off: a live-looking control that does nothing is
       worse than a dim one that explains itself in the caption underneath. */
    .btn:disabled { opacity: .45; cursor: default; }

    input[type="text"] {
      min-height: 48px;
      font-size: var(--font-body);
      font-family: inherit;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      padding: 0 var(--space-2);
      width: 100%;
    }
    textarea {
      font-size: var(--font-body);
      font-family: inherit;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      padding: var(--space-1) var(--space-2);
      width: 100%;
    }
    input[type="text"]:focus,
    textarea:focus { outline: 2px solid var(--color-accent); outline-offset: 1px; }

    /* The search field, on the walk and on the home screen. The X sits INSIDE
       the field on the right, so the field keeps the full width and the tap
       target is where a phone keyboard has taught him to look for it. */
    .search-wrap { position: relative; }
    .search-input { padding-right: 52px; }
    .search-clear {
      position: absolute;
      top: 0;
      right: 0;
      width: 48px;
      height: 100%;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--color-text-muted);
      font-size: 1.1rem;
      line-height: 1;
      border-radius: 10px;
    }
    .search-clear:active { color: var(--color-text); }
    .search-clear[hidden] { display: none; }
    input.field-invalid { border-color: var(--color-danger); outline-color: var(--color-danger); }

    .section-heading {
      font-size: var(--font-lg);
      font-weight: 700;
      margin: var(--space-4) 0 var(--space-2);
    }
    .section-heading:first-child { margin-top: 0; }

    .empty-state {
      font-size: var(--font-body);
      color: var(--color-text-muted);
      padding: var(--space-4) 0;
      text-align: center;
    }

    /* The muted line under the thing it explains. Sits beside real content,
       where .empty-state stands in for content that isn't there. */
    .caption {
      margin: 2px 0 var(--space-1);
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }

    /* The same line when what it says is a problem: how long it has been since
       the last backup, past the point where that is news. AMBER and bold, so it
       stops being furniture without pretending something has broken — see
       .btn-danger for why red is not available to it. */
    .caption-warn { color: var(--color-warn-text); font-weight: 700; }

    /* The build stamp at the very bottom of Settings. Centered and quiet: it is
       reference, not something to read on the way past. */
    .app-version { margin-top: var(--space-4); text-align: center; }

    /* The line at the top of a screen that says which bid he is looking at.
       Costs & price and Proposal both print it, so it is one rule and not two:
       the title, then the customer under it in muted type. */
    .screen-head { margin-bottom: var(--space-3); }
    .screen-head-title { font-size: var(--font-lg); font-weight: 800; overflow-wrap: anywhere; }
    .screen-head-cust { margin-top: 2px; font-size: var(--font-body); color: var(--color-text-muted); }
    /* The area screen: the room's name is the subject of the whole screen
       rather than a label sitting on the left of it. */
    .screen-head-center { text-align: center; }
    /* Sized to its own words and centered under the title: .link-btn is a
       full-width left-aligned block everywhere else, and that width belongs to
       a card rather than to a heading. */
    .screen-head-center .screen-head-action {
      display: inline-block;
      width: auto;
      min-height: 48px;
      margin-top: 0;
      padding: 0 12px;
    }
    /* Backing out of the walk's rental/equipment sheet. Secondary, like every
       other Cancel in the app now. */
    .link-btn.sheet-cancel { width: auto; min-height: 48px; color: var(--color-text-muted); }

    /* ---------- Shared components (built by ui.js) ---------- */
    .card {
      display: block;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: var(--space-3);
      margin-bottom: var(--space-2);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      /* The top bar is sticky, so a card scrolled to by the Settings jump
         strip would otherwise arrive with its title underneath it. */
      scroll-margin-top: calc(var(--chrome-height) + var(--space-2));
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-text-muted);
      margin-bottom: var(--space-2);
    }
    /* The same heading, sitting on the page over a GROUP of cards rather than
       inside one — the walk's areas, which are a card each. Tighter underneath
       than a card's own title, so the heading and the cards read as one
       section instead of as a stray line above them. */
    .group-heading { margin: 0 0 var(--space-1); }
    /* A card title that is also the way out of what is open under it — the
       clause library. Nothing about it changes except the cursor and a press
       state: it is still the heading, it just answers a tap. */
    .card-title-tap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      min-height: 48px;
      cursor: pointer;
    }
    .card-title-tap:active { color: var(--color-accent); }
    /* The word that makes the heading look like a control. A title that only
       answers a tap when you happen to try it is not a way out, and this app's
       rule is that anything tappable says so in words. */
    .card-title-close {
      flex: 0 0 auto;
      color: var(--color-accent);
      font-weight: 700;
      text-decoration: underline;
    }

    /* A row is the whole tap target — no small pencil icons to aim at. */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      width: 100%;
      min-height: 56px;
      padding: var(--space-1) 0;
      text-align: left;
      font-family: inherit;
      font-size: var(--font-body);
      color: var(--color-text);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--color-border);
    }
    .row:last-child { border-bottom: none; }
    .row-label { color: var(--color-text-muted); }
    /* The walk's two-line row, on a settings row: the name on top, what it is
       under it. Only drawn when a caller asks for one (row's opts.sub), so
       every other row in the app keeps its single flex line — and inside it
       the label takes .walk-row-name's shape rather than a plain row label's,
       because a muted name over a muted sub is one grey block, not two lines.
       Both are display:block: as inline spans they ran together into
       "3/4" hubBoxes & fittings". */
    .row-text { flex: 1; min-width: 0; }
    .row-text > .row-label { display: block; color: var(--color-text); font-weight: 700; }
    .row-sub { display: block; margin-top: 2px; font-size: 0.9rem; color: var(--color-text-muted); }
    .row-value { font-weight: 700; text-align: right; }
    /* A value too long to sit beside its label: "Send it to" and a real work
       email came to more than the row was wide, and the label wrapped to two
       words over one. The label takes the first line to itself and the value
       takes the second, left-aligned and breaking wherever it has to. */
    .row.row-stack { flex-wrap: wrap; align-items: baseline; row-gap: 4px; }
    .row.row-stack .row-label { flex: 1 1 100%; }
    /* basis 0, not auto: an address wider than the row would otherwise set the
       line's width and push the › onto a third line of its own. */
    .row.row-stack .row-value { flex: 1 1 0; min-width: 0; text-align: left; overflow-wrap: anywhere; }

    /* ---------- Tap affordance ---------- */
    /* One rule for the whole app, applied by the ui.js builders: a thing that
       does something looks like it does something. Press feedback on every
       control (a tap that opens a full-screen keypad still has to say it
       landed), a chevron for "this opens something", the value in navy for
       "this opens a keypad", and nothing at all on a row that is only a fact.
       120ms is long enough to see and short enough not to lag the thumb. */
    .tap { transition: background-color 120ms ease; }
    .tap:active { background: #e2e8f0; }
    .chev {
      flex: 0 0 auto;
      margin-left: 2px;
      color: var(--color-text-muted);
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1;
    }
    /* Navy on its own is not enough: #041E42 next to the body's #0f172a is two
       near-blacks, and the whole point is that a value he can change looks
       different from one he cannot. The dotted rule under it is the same thing
       a fillable field wears on paper. */
    .tap-value .row-value {
      color: var(--color-accent);
      text-decoration: underline dotted rgba(4, 30, 66, 0.4);
      text-underline-offset: 5px;
      text-decoration-thickness: 2px;
    }
    /* On the navy job card the same rule has to be light, not dark. */
    .job-actual .tap-value .row-value {
      color: #fff;
      text-decoration-color: rgba(255, 255, 255, 0.5);
    }
    /* Not a control: no press state, no chevron, and the value stays in body
       colour so it is never mistaken for a navy one that opens a keypad. */
    .row.flat { cursor: default; }
    /* The one number a screen exists to produce, when it is a row rather than
       a block — the same .big-number the walk and the proposal put in a block.
       One class, one size, one weight, wherever the number lands. Exactly one
       per screen wears it. */
    .big-number .row-value { font-size: var(--font-xl); font-weight: 800; }
    /* A value that opens a keypad, on the two rows that are not .row. */
    .tap-value .walk-row-value,
    .tap-value .price-line-value { color: var(--color-accent); }

    /* A whole card that is one button — the areas on the walk. */
    .card-tap {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      min-height: 72px;
      text-align: left;
      font-family: inherit;
      font-size: var(--font-body);
      color: var(--color-text);
    }
    .card-tap-text { flex: 1; min-width: 0; }
    /* What KIND of card this is, over the name he gave it. Small and muted:
       it is a label on the thing, not a second title competing with it. */
    .card-tap-tag {
      margin-bottom: 2px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }
    .card-tap-title { font-weight: 700; overflow-wrap: anywhere; }
    .card-tap-sub { margin-top: 2px; font-size: 0.9rem; color: var(--color-text-muted); }
    /* A preview of something written rather than counted. One line, always:
       the caller has already cut it to 60 characters, and this stops a single
       long word from finding the second line anyway. */
    .card-tap-note {
      margin-top: 2px;
      font-size: 0.9rem;
      color: var(--color-text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-tap-value { flex: 0 0 auto; font-weight: 700; white-space: nowrap; }

    /* ---------- Attached strips ---------- */
    /* The one shape every inline menu in this app wears: inside the parent
       card, indented 12px past the row that opened it, a 3px accent edge and a
       light tint tying it to that row, and 16px of clear space before whatever
       comes next — the Cancel button used to touch the following section, which
       read as the next card having a stray button on top of it. */
    .attached-strip {
      margin: var(--space-1) 0 var(--space-3) var(--space-2);
      padding: var(--space-2);
      border-left: 3px solid var(--color-accent);
      border-radius: 0 10px 10px 0;
      background: #eef2f7;
    }
    .attached-strip .field-label { margin-top: 0; }
    .attached-strip-btns { display: flex; flex-wrap: wrap; gap: var(--space-1); }
    /* Sized off its own label and then grown into what the row has left, so a
       three-word button gets a line and the strip still fills the card. */
    .attached-strip-btns .btn { flex: 1 1 auto; min-height: 48px; padding: 0 12px; font-size: 0.95rem; }
    /* Backing out of a menu is not a destructive act and must not wear the
       colour of one: a text button, not an outlined red one. */
    /* A strip whose only action is the quiet one is two muted lines stacked:
       "Delete" over "Cancel", same colour, same weight, and nothing saying
       they are two different answers. The hairline says it. */
    .strip-rule {
      height: 1px;
      margin-top: var(--space-2);
      background: var(--color-border);
    }
    .attached-strip .attached-strip-cancel {
      width: auto;
      min-height: 48px;
      /* Auto width so it does not read as a second primary, but a four-letter
         label ("Done") shrank it to 40px across, under what a thumb needs. */
      min-width: 48px;
      margin-top: var(--space-1);
      color: var(--color-text-muted);
    }

    /* ---------- Check rows ---------- */
    /* The pile on the Invoices home. Two targets in one line: the square on
       the left toggles whether this group gets billed, and everything right of
       it opens the entry. They are separate buttons rather than one row with a
       corner that behaves differently, because a thumb that misses by 4px
       should do the harmless one, not the surprising one. */
    .check-row { display: flex; align-items: center; gap: var(--space-2); padding: 4px 0; }
    /* The button is 44px square and the box he sees inside it is 24px: the
       thing to aim at is bigger than the thing to look at. A 24px button beside
       a second button that opens a different screen is half the size of every
       other target in this app, and a thumb that misses it does the surprising
       thing rather than the harmless one. */
    .check-box {
      flex: none;
      width: 44px;
      height: 44px;
      padding: 0;
      border: none;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .check-mark {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 2px solid var(--color-border);
      background: var(--color-surface);
      /* The mark is always in the DOM, so the row does not change width when
         it is turned off, and it is invisible rather than absent. */
      color: transparent;
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .check-box.on .check-mark {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: #fff;
    }
    /* The text half of the row is a lineRow, so it presses and wears its
       chevron like every other tappable line in the app; all this does is let
       it take the space the square does not. */
    .check-row .check-text { flex: 1 1 auto; min-width: 0; }

    /* ---------- Invoices ---------- */
    /* Who owes you: the one number the tab exists to answer, on the navy the
       rest of the app spends on the primary button. */
    .inv-owes { background: var(--color-accent); color: #fff; }
    .inv-owes .caption, .inv-owes .card-title { color: #dbe3ee; }
    .inv-big { font-size: 26px; font-weight: 800; line-height: 1.2; margin: 4px 0; }
    /* Old, not wrong. Same amber as .inline-warn, because it is the same kind
       of news: a condition the row is still in, said quietly. Nothing on a
       screen in this app is red. */
    /* Both spellings: .walk-row paints its own transparent background, and on a
       line row that rule is later and just as specific, so a bare .inv-stale
       lost to it and the amber never appeared. */
    .inv-stale, .walk-row.inv-stale {
      background: var(--color-warn-bg);
      border-radius: 10px;
      padding-left: var(--space-1);
      padding-right: var(--space-1);
    }
    .inv-stale .walk-row-sub { color: var(--color-warn-text); }
    /* An invoice in progress is a whole card now, so the amber has to land on
       one without eating the padding the card already has. Same warn colours,
       the card's own shape. */
    .card.inv-stale {
      background: var(--color-warn-bg);
      border-color: var(--color-warn-border);
      border-radius: 12px;
      padding: var(--space-3);
    }

    /* ---------- The log entry ---------- */
    /* "not on this one" is an answer, not a value: muted, so a list of four men
       reads at a glance as the two who were there and the two who were not. */
    .log-crew-off .row-value { color: var(--color-text-muted); font-weight: 600; }

    /* ---------- The pinned action ---------- */
    /* One per screen, above the tab bar: the single thing this screen is for,
       never a scroll away. The spacer is a sibling in the flow rather than a
       class on the host, so a screen that only sometimes has a bar cannot leave
       80px of dead space behind on the render that drops it. */
    .pinbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--tabbar-height) + env(safe-area-inset-bottom));
      z-index: 15;
      padding: var(--space-2) 20px;
      background: var(--color-bg);
      border-top: 1px solid var(--color-border);
    }
    .pinbar .btn { min-height: 56px; font-size: 1.15rem; }
    .pinbar-spacer { height: 80px; }
    /* A panel is a full-screen question. The bar underneath it is covered
       anyway (z-index 100 over 15), but a fixed element on iOS can still catch
       a stray touch at the edge of a scrolling overlay. */
    body.panel-open .pinbar { display: none; }

    /* ---------- The step strip ---------- */
    /* Walk · Labor · Price · Proposal across the top of every screen inside a
       bid. nowrap with an overflow scroll rather than wrapping: two lines of
       breadcrumb at the top of every screen is a header, not a hint. */
    .stepstrip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: var(--space-3);
    }
    .stepstrip::-webkit-scrollbar { display: none; }
    .stepstrip-step {
      flex: 0 0 auto;
      min-height: 48px;
      /* "Price" is the shortest word in the strip and came out 43.94px wide,
         which is under the 44px a thumb needs by a rounding hair. The floor is
         cheaper than the word being a fraction narrower than the rule. */
      min-width: 44px;
      padding: 0 6px;
      border: none;
      border-radius: 10px;
      background: transparent;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-text-muted);
      white-space: nowrap;
    }
    .stepstrip-step:active { background: #e2e8f0; }
    /* Done is navy and carries a tick. Everything he has not reached is the
       muted grey the rest of the app uses for a fact he cannot change. */
    .stepstrip-done { color: var(--color-accent); }
    /* Where he is standing. Navy on navy-and-grey was the whole problem: bold
       navy text next to done navy text is two shades of the same answer, and on
       a 375px phone with the strip scrolled it is no answer at all. A filled
       pill is not a shade, it is a shape. */
    .stepstrip-now {
      background: var(--color-accent);
      color: #fff;
      font-weight: 800;
      padding: 0 12px;
    }
    .stepstrip-now:active { background: var(--color-accent); }
    .stepstrip-dot { flex: 0 0 auto; color: var(--color-border); }

    /* ---------- What's this? ---------- */
    /* One caption line per card; the rest of the explanation folds behind this.
       Left-aligned and sized to its own words, because .link-btn is a
       full-width block everywhere else and that width belongs to a card. */
    .whats-this { margin-bottom: var(--space-1); }
    .whats-this-btn {
      width: auto;
      min-height: 48px;
      margin-top: 0;
      padding: 0;
      font-size: 0.9rem;
    }
    .whats-this .caption { margin-top: 0; }

    /* ---------- The one number ---------- */
    /* 28px, 800, left-aligned, everywhere. The walk, labor, the price screen,
       the proposal and the job each produce exactly one number, and they used
       to produce it in three different classes — .labor-big centered it, and
       .row-big and .big-number-value said the same two declarations twice. */
    .big-number { margin: var(--space-1) 0 var(--space-2); text-align: left; }
    .big-number-value { font-size: var(--font-xl); font-weight: 800; line-height: 1.15; }
    .big-number-sub { margin-top: 2px; font-size: 0.9rem; color: var(--color-text-muted); }

    .chip {
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1.5px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 0.95rem;
      font-weight: 600;
    }
    .chip-selected {
      border-color: var(--color-accent);
      background: var(--color-accent);
      color: #fff;
    }

    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #e2e8f0;
      color: var(--color-text-muted);
    }
    .pill-sent { background: rgba(4, 30, 66, 0.12); color: var(--color-accent); }
    .pill-won { background: rgba(21, 128, 61, 0.12); color: var(--color-confirm); }
    .pill-lost { background: rgba(185, 28, 28, 0.1); color: var(--color-danger); }
    .pill-complete { background: var(--color-accent); color: #fff; }

    /* ---------- Bids home ---------- */
    /* The nudge bands: the two things that cost real money when they are
       missed (a proposal nobody answered, work that only exists inside this
       phone), said in a sentence and tappable straight through to the fix. */
    .nudges {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }
    .nudge {
      width: 100%;
      min-height: 56px;
      padding: var(--space-2) var(--space-3);
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.35;
      text-align: left;
      background: var(--color-warn-bg);
      border: 1px solid var(--color-warn-border);
      color: var(--color-warn-text);
    }
    /* There is no red nudge. A band on the home screen is a warning — a bid
       nobody answered, a phone with no backup — and warnings are amber here.
       Full red on the first screen of the app was the loudest thing in it,
       said on the day he installed it, about something he had not done yet. */
    .nudge:active { filter: brightness(0.96); }
    /* The band is a toggle, so it has to look pressed while its filter is on. */
    .nudge-on { box-shadow: inset 0 0 0 2px currentColor; }

    .bids-search { margin-bottom: var(--space-3); }
    .walk-search { margin-bottom: var(--space-2); }

    .bid-card {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      margin-bottom: var(--space-2);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    /* The card holds a second button, so it is a container and the tap target
       is the button filling it. A button inside a button is not a thing. */
    .bid-main {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      min-width: 0;
      min-height: 72px;
      /* The › is the row's right edge now, so it takes the padding's place
         rather than being added on top of it: this line is four facts wide
         already and a fifth column of whitespace is what wraps it. */
      padding: var(--space-2) var(--space-1) var(--space-2) var(--space-3);
      border: none;
      border-radius: 12px 0 0 12px;
      background: transparent;
      font-family: inherit;
      color: var(--color-text);
      text-align: left;
    }
    /* The two lines of words, with the › beside them rather than under them. */
    .bid-main-text { flex: 1; min-width: 0; }
    .bid-main .chev { margin-left: 0; }
    /* A long press on this row opens the app's own menu. Without these, iOS
       answers the same gesture with its native callout and a text selection
       over the customer name, and the owner gets two menus fighting. */
    .bid-main {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    /* A long plant name plus a title used to break onto a second and third
       line and push the row to twice its height. One line, cut with an
       ellipsis: the first few words are what he recognizes a bid by, and a
       list where every row is the same height is a list he can scan. */
    .bid-line1 {
      font-size: var(--font-body);
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bid-line2 {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-1);
      margin-top: 6px;
      font-size: 0.95rem;
      color: var(--color-text-muted);
    }
    .bid-price { font-weight: 700; color: var(--color-text); }
    /* The date and the number are ONE block pinned to the right edge, and the
       auto margin belongs to the first of them. Both had it, which on a 375px
       phone split the leftover space between them and pushed the number off
       the end of the line — the row then wrapped and the price sat alone over
       a second line holding nothing but a date. Neither ever breaks. */
    .bid-when { margin-left: auto; white-space: nowrap; }
    .bid-number { white-space: nowrap; }
    .bid-more {
      width: 52px;
      min-height: 72px;
      border: none;
      border-radius: 0 12px 12px 0;
      background: transparent;
      color: var(--color-text-muted);
      font-size: 1.5rem;
    }
    .bid-more:active { background: #eef2f7; }
    /* The ⋯ menu takes the whole width of the card, on its own line under the
       row it belongs to. */
    /* flex-basis 100% PLUS margins overflows a flex row, which put the menu's
       tinted block 8px past the card's own rounded edge. max-width takes the
       margins back out of the basis. */
    .bid-card > .attached-strip {
      flex: 1 1 100%;
      box-sizing: border-box;
      max-width: calc(100% - var(--space-2) - var(--space-2));
      margin: 0 var(--space-2) var(--space-2) var(--space-2);
    }

    /* ---------- Bid screen and header form ---------- */
    .field-label {
      margin: var(--space-3) 0 var(--space-1);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-text-muted);
    }
    /* Two or three big buttons side by side: this app's answer to a dropdown. */
    .toggle-row { display: flex; gap: var(--space-1); }
    /* min-width:0 so flex-basis:0 actually wins: a flex item's automatic
       minimum is its content width, which would make "Scope & price"
       claim more room than "Full" and leave the row visibly lopsided. */
    .chip-lg { flex: 1 1 0; min-width: 0; min-height: 56px; padding: 0 8px; font-size: 1.05rem; line-height: 1.2; }
    .btn-half { flex: 1; min-height: 56px; }

    .inline-warn {
      margin-top: 4px;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      background: var(--color-warn-bg);
      border: 1px solid var(--color-warn-border);
      color: var(--color-warn-text);
    }

    .bid-head-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-2);
      color: var(--color-text-muted);
    }

    /* "Edit details" is a secondary route, not a fifth big button competing
       with the ones that matter, but it still gets a 44px target. */
    .link-btn {
      display: block;
      width: 100%;
      min-height: 48px;
      margin-top: var(--space-2);
      padding: 0;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      color: var(--color-accent);
      text-align: left;
    }
    /* Rename, Change, Edit details: the same three words in three different
       shapes, all of them a stretch of navy text with nothing round it. One
       look now — sized to its own words, outlined so it reads as a control,
       and 48px whatever the line it sits on is doing. */
    .link-btn.link-btn-inline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      min-height: 48px;
      margin-top: 0;
      padding: 0 14px;
      border: 1.5px solid var(--color-border);
      border-radius: 10px;
      font-size: 0.95rem;
    }
    .link-btn.link-btn-inline:active { background: #e2e8f0; }

    /* DELETE, EVERYWHERE IT APPEARS ON A SCREEN. Plain muted text, no outline,
       no colour, 48px tall, and always the last thing in the strip or the menu
       it belongs to. Two reasons it is not red: an outlined red button beside
       Rename is the loudest thing in the strip, which points the eye at the one
       action nobody wants; and it sat under the same thumb as the edits. The
       red now lives only on the confirm panel's primary button, where a colour
       is asking a question instead of waiting to be pressed. */
    .link-btn.link-btn-quiet {
      color: var(--color-text-muted);
      /* Never lighter than the Cancel under it. At 600 beside a 700 Cancel the
         only real action in a strip read as the caption of the one that backs
         out of it — quiet is a COLOUR here, not a weight. */
      font-weight: 700;
    }
    /* Pressed, it goes to body colour. It used to go red, which put a third
       red control in a stylesheet whose rule is two. */
    .link-btn.link-btn-quiet:active { color: var(--color-text); }
    /* The same quiet link on a dark ground — the photo viewer, which is #0f172a
       edge to edge. --color-text-muted is #475569 and lands at 2.4:1 on it,
       which is not a visible button, it is a rumour of one. #cbd5e1 is 13:1. */
    .link-btn.link-btn-quiet.on-dark { color: #cbd5e1; }
    .link-btn.link-btn-quiet.on-dark:active { color: #ffffff; }
    /* A side trip out of a strip that is not one of the row's own edits, and
       not destructive either: "Check price" opens a search in another tab. */
    .link-btn.link-btn-strip { color: var(--color-accent); }

    /* The link under a keypad's caption. Centred with the caption above it,
       sized to its own words, and 48px like everything else a thumb lands on. */
    .link-btn.panel-caption-action {
      width: auto;
      min-height: 48px;
      margin: 0 auto var(--space-1);
      text-align: center;
    }

    .bid-nav {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }
    .bid-nav .btn { min-height: 60px; font-size: 1.15rem; }

    /* ---------- The walk ---------- */
    /* One screen, three views (areas / one area / adding an item), plus two
       full-screen overlays of its own: the photo viewer and the small
       rental-or-equipment sheet. Both sit above the tab bar at z-index 90 and
       below the shell's panels at 100, so a keypad opened from a sheet still
       covers it. */
    /* The areas section: a heading, a card per area, and "+ Area" as its last
       row. The button used to be appended straight to the page, where it had
       no margin of its own and sat shoulder to shoulder with the misc card
       under it — it read as that card's button. Grouped, the standard 12px
       card gap goes under the whole section instead. */
    .walk-areas { margin-bottom: var(--space-2); }

    /* A two-line version of .row: a name and its money on the first line, the
       counts underneath. The whole block is the tap target. */
    .walk-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      min-height: 60px;
      padding: var(--space-1) 0;
      text-align: left;
      font-family: inherit;
      font-size: var(--font-body);
      color: var(--color-text);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--color-border);
    }
    .walk-row:last-child { border-bottom: none; }
    button.walk-row:active { background: #eef2f7; }
    .walk-row-text { flex: 1; min-width: 0; }
    .walk-row-name { font-weight: 700; }
    .walk-row-sub { margin-top: 2px; font-size: 0.9rem; color: var(--color-text-muted); }
    .walk-row-value { font-weight: 700; white-space: nowrap; }
    /* The line he just added, for about a second — on a list of twenty parts,
       "did that go in?" is answered without reading. */
    .walk-row-new { animation: walk-flash 1s ease-out; }
    @keyframes walk-flash {
      from { background: rgba(21, 128, 61, 0.22); }
      to { background: transparent; }
    }

    .walk-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
    .walk-tile {
      min-height: 88px;
      padding: var(--space-2);
      border-radius: 12px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--color-text);
    }
    .walk-tile:active { background: #eef2f7; }

    /* The running total at the top of the add list: quiet, but the only proof
       that the last eight taps landed. It STICKS: the proof is worth nothing
       eleven rows down a parts list, which is exactly where his thumb is by
       the time he needs it. Under the chrome (which is sticky at 0 and opaque)
       and over the rows, with the list's own background so a row sliding
       beneath it does not read through. */
    .walk-tally {
      position: sticky;
      top: var(--chrome-height);
      z-index: 5;
      margin-bottom: var(--space-2);
      /* The 12px gap under it is page, not strip, so a row would show through
         it in a thin sliver as the list scrolls past. The shadow paints that
         gap in the page's own colour, which is the whole of what it is for. */
      box-shadow: 0 var(--space-2) 0 var(--color-bg);
      padding: var(--space-1) var(--space-2);
      border-radius: 10px;
      background: #eef2f7;
      color: var(--color-accent);
      font-weight: 700;
    }

    .walk-thumbs { display: flex; flex-wrap: wrap; gap: var(--space-1); }
    .walk-thumb {
      width: 88px;
      height: 88px;
      padding: 0;
      overflow: hidden;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: #e2e8f0;
    }
    .walk-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* Full-size photo: dark ground, because a photo of a dim mechanical room
       read against white is a photo he can't see. */
    .walk-photo-view {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: flex;
      flex-direction: column;
      background: #0f172a;
      padding: calc(var(--space-3) + var(--sai-top)) var(--space-3);
      padding-bottom: calc(var(--space-3) + env(safe-area-inset-bottom));
    }
    .walk-photo-view img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
    /* Close is the button; Delete is a muted line under it, because nothing on
       a screen is red and the way out of a photo is not the way to destroy it. */
    .walk-photo-actions { margin-top: var(--space-3); }
    .walk-photo-actions .btn { width: 100%; min-height: 56px; }

    .walk-sheet {
      position: fixed;
      inset: 0;
      z-index: 90;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--color-bg);
      padding: calc(var(--space-4) + var(--sai-top)) 20px;
      padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom));
    }

    /* Two lines, the way .walk-row is two lines: the question across the full
       width, the answer under it. Beside the buttons a label like
       "Washdown-rated (NEMA 4X / stainless) requirements" had about eleven
       characters of width at 375 points and came down the screen a word at a
       time. Nothing he is asked to read should be a sliver. */
    .walk-forget {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: var(--space-1);
      min-height: 56px;
      padding: var(--space-1) 0;
      border-bottom: 1px solid var(--color-border);
    }
    .walk-forget:last-child { border-bottom: none; }
    .walk-forget-label { min-width: 0; }
    /* The buttons are .attached-strip-btns, shared with every inline menu in
       the app: 48 px tall, splitting the line between them. On a line of their
       own now, so there is nothing about their width left to override. */
    .walk-forget-acts { width: 100%; }
    /* Answered, and still a control: tapping it puts the question back. Sized
       to its own words rather than the line, because one button stretched
       across the width reads as the primary thing to do on the card. */
    .walk-forget-tick {
      align-self: flex-start;
      min-height: 48px;
      padding: 0 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-confirm);
    }
    /* The answered rows folded into one line. Left-aligned and wrapping,
       because it is a list of words rather than a button label. */
    .walk-forget-fold {
      text-align: left;
      line-height: 1.35;
      padding: var(--space-1) 0;
      color: var(--color-text-muted);
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* ---------- Labor ---------- */
    /* One line — crew chips and a day count — or the same pair once per task.
       The readout under it is the only place on the screen that is not a
       control, so it is deliberately plain. */
    /* Chips wrap: a five-man crew must not push the fifth name off the edge. */
    .labor-chips { display: flex; flex-wrap: wrap; gap: var(--space-1); }

    /* The captions sit between the rows, so :last-child never lands on the
       bottom row and its divider would otherwise hang under nothing. */
    .labor-readout .row { border-bottom: none; }
    .labor-readout .row-value { font-weight: 800; }

    .labor-warn-actions { display: flex; gap: var(--space-1); margin-top: var(--space-1); }
    /* The one way out of a state that is blocking every save on the bid — a
       full-size target, not a 44px afterthought. */
    .labor-warn-actions .btn { min-height: 56px; padding: 0 18px; }

    /* Hours per day is a SETTINGS value that happens to be reachable here. It
       used to be the only chevron on the screen, which made the one thing that
       changes every bid in the file look like the main road through this one.
       Now it reads as the fact it is, with a small Change beside it. */
    .labor-hpd { display: flex; align-items: baseline; gap: var(--space-1); flex-wrap: wrap; }
    .labor-hpd-text { flex: 1 1 60%; min-width: 0; color: var(--color-text-muted); font-size: 0.95rem; line-height: 1.35; }
    /* 48, not the .link-btn 44: it is a real control on a screen he uses with
       one thumb in a truck, and 44 was the only tap target on it under the
       size everything else here is built at. */
    .labor-hpd-change { flex: 0 0 auto; width: auto; min-height: 48px; margin-top: 0; padding: 0 8px; }

    /* The task he just added, for about a second — same flash the walk uses on
       a part, for the same reason: "did that go in?" answered without reading. */
    .labor-task-new { animation: walk-flash 1s ease-out; }

    /* ---------- Costs & price ---------- */
    /* Three cards down one column: the costs that aren't material or labor,
       what the job costs him, and what he sells it for. The cost stack is his
       eyes only and never prints. */
    /* The screen's title line is .screen-head, up in the shared blocks — the
       proposal screen prints the same one. */

    /* A rental or a piece of equipment: name and money on top, the small
       controls underneath. Same shape as a walk row, with chips instead of a
       second line of text — days, marked up, and the ⋯ are all separate
       answers and each one needs its own target. */
    .price-line { padding: var(--space-1) 0; border-bottom: 1px solid var(--color-border); }
    .price-line:last-child { border-bottom: none; }
    .price-line-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      width: 100%;
      min-height: 48px;
      padding: 0;
      text-align: left;
      font-family: inherit;
      font-size: var(--font-body);
      color: var(--color-text);
      background: transparent;
      border: none;
    }
    .price-line-name { font-weight: 700; min-width: 0; }
    .price-line-value { font-weight: 700; white-space: nowrap; }
    .price-line-sub { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: 4px; }
    /* The tool picker's chips, shared with the walk's rental/equipment sheet
       and with every set of chips that rides inside an attached strip. */
    .equip-chips { display: flex; flex-wrap: wrap; gap: var(--space-1); }

    /* A yellow chip is a line that is not priced yet: it is the same warning
       color as .inline-warn, because it is the same kind of news. */
    .chip-warn {
      border-color: var(--color-warn-border);
      background: var(--color-warn-bg);
      color: var(--color-warn-text);
    }
    /* A fact about the line, shaped like a chip so it sits in the same row.
       A <span>, not a disabled button: there is nothing to press, and it must
       not read as a control that refuses every tap. */
    .chip-fact { display: inline-flex; align-items: center; }
    .chip-flat { border-style: dashed; color: var(--color-text-muted); }
    .chip:disabled { opacity: .55; }

    /* A cost row he can type on. These used to reach every bid in the file and
       wore an "all bids" tag saying so; they are this bid's own numbers now,
       and the accent is what marks them as editable. */
    .price-settings-row .row-value { color: var(--color-accent); font-weight: 700; }
    /* The way back to the shop's numbers, under the true cost it moves. */
    .price-use-settings { display: block; margin-top: 12px; }
    .price-truecost { font-size: 1.2rem; }
    .price-truecost .row-label, .price-truecost .row-value { font-weight: 800; color: var(--color-text); }

    /* Margin and the labor rate are two other ways of saying the price, so
       they sit at body size and only the price itself wears .big-number. One
       screen, one number in the biggest type on it. */
    /* Off means "you can't move this yet", not "you can't read this": the
       label and the tap affordance go quiet, the money stays fully legible —
       it is still the price of the job. */
    .price-row-off .row-label { opacity: .45; }
    .price-pills { display: flex; gap: var(--space-1); margin: var(--space-1) 0 var(--space-2); }
    .price-pills .chip { flex: 1 1 0; min-width: 0; padding: 0 8px; }

    /* Sentences, not controls: whether the number above is one to say out loud. */
    .price-note { margin: 0 0 var(--space-1); font-size: var(--font-body); line-height: 1.35; }
    .price-note-bad { font-weight: 700; color: var(--color-danger); }
    .price-readout .row { min-height: 44px; }

    /* ---------- Bars ---------- */
    /* The only chart in the app: how much of a thing is gone. The fill stops
       at full and turns red past it, and the line underneath says by how much.
       The job screen burns hours against it, Reports burns hours, surprises,
       wins and margin against it, and there is one of these, not five. */
    .bar {
      height: 12px;
      border-radius: 999px;
      background: rgba(4, 30, 66, 0.12);
      overflow: hidden;
      margin: var(--space-2) 0 var(--space-1);
    }
    .bar-fill { height: 100%; border-radius: 999px; background: var(--color-accent); }
    .bar-over { background: var(--color-danger); }

    /* ---------- Job (Task 12) ---------- */
    /* The week he is looking at, with a way either side of it. Both arrows are
       full-height targets: this gets tapped with a glove on. */
    .job-weeknav { display: flex; align-items: center; gap: var(--space-1); margin-bottom: var(--space-1); }
    .job-weeknav-label { flex: 1; min-width: 0; text-align: center; font-weight: 700; }
    .job-weeknav-btn { min-width: 64px; padding: 0; font-size: 1.2rem; }
    .job-weeknav-btn:disabled { opacity: .35; }

    .job-done { margin-bottom: var(--space-3); font-weight: 700; color: var(--color-confirm); }

    /* The card this whole app is for. Navy, so it reads as the answer to the
       job rather than as one more list of rows. */
    .job-actual { background: var(--color-accent); border-color: var(--color-accent-dark); }
    .job-actual .card-title { color: rgba(255, 255, 255, 0.75); }
    .job-actual .row { color: #fff; border-bottom-color: rgba(255, 255, 255, 0.18); }
    .job-actual .row-label { color: rgba(255, 255, 255, 0.75); }
    .job-actual .row-value { color: #fff; font-weight: 800; }
    .job-actual .caption { color: rgba(255, 255, 255, 0.7); }
    /* Green is "still the job you sold"; red is "it is costing you the
       margin". Both are legible on navy, which the app's own two greens and
       reds are not. */
    .job-actual .job-good .row-value { color: #86efac; }
    .job-actual .job-bad .row-value { color: #fca5a5; }

    /* ---------- Reports (Task 15) ---------- */
    /* Four readings on one card, each one a heading, a number, a bar and a
       sentence in his own words. The sentence is the point: a percentage he
       has to interpret is a percentage he will not use. */
    .rep-stat { margin-top: var(--space-4); }
    .rep-stat:first-of-type { margin-top: 0; }
    .rep-headline .row-value { font-size: var(--font-lg); font-weight: 800; }
    /* The plain-English line under each stat. Bigger than a caption, because
       it is the part he reads. */
    .rep-says { margin: var(--space-1) 0 0; font-size: var(--font-body); line-height: 1.35; }
    /* Green is "still the job you sold", red is "it cost you the margin" — the
       same rule as the job card, on white instead of navy. */
    .rep-good .row-value { color: var(--color-confirm); }
    .rep-bad .row-value { color: var(--color-danger); }

    /* ---------- Utilities ---------- */
    /* ---------- Proposal (Task 11) ---------- */
    /* The preview is a piece of paper on a phone: white, boxed, and set a size
       smaller than the app around it so it reads as the document rather than
       as more of the screen. Every number in it is BidMath.fmt's. */
    .prop-preview {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: var(--space-2);
      font-size: 0.95rem;
      margin-top: var(--space-1);
    }
    .prop-doc-head { border-bottom: 2px solid var(--color-accent); padding-bottom: var(--space-1); }
    .prop-co { font-size: var(--font-body); font-weight: 800; color: var(--color-accent); }
    .prop-co-sub { color: var(--color-text-muted); font-size: 0.85rem; margin-top: 2px; }
    .prop-meta { margin-top: var(--space-1); }
    .prop-meta-row {
      display: flex;
      justify-content: space-between;
      gap: var(--space-2);
      padding: 1px 0;
    }
    .prop-meta-row span:first-child { color: var(--color-text-muted); }
    .prop-meta-row span:last-child { font-weight: 600; text-align: right; }
    .prop-doc-title { margin-top: var(--space-1); font-weight: 700; }
    .prop-sec-title {
      margin-top: var(--space-2);
      padding: 3px var(--space-1);
      background: #f1f5f9;
      color: var(--color-accent);
      font-weight: 700;
      border-radius: 4px;
    }
    /* Baseline, not center: a description that wraps to two lines must not
       drag its price down to sit between them. */
    .prop-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: var(--space-2);
      padding: 3px 0;
      border-bottom: 1px solid var(--color-border);
    }
    /* Two lines, not a wrap: what it is, then how many at what each. Run
       together they wrapped on a 375px phone and left the unit price sitting
       under the row's own total, reading as the same number twice. */
    .prop-line-desc { min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; }
    .prop-line-sub { color: var(--color-text-muted); font-size: 0.85rem; }
    .prop-line-money { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .prop-bullets { margin: var(--space-1) 0 0; padding-left: 20px; }
    .prop-bullets li { padding: 2px 0; overflow-wrap: anywhere; }
    /* The one number he must not have to hunt for, at all three levels. */
    .prop-total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: var(--space-2);
      padding: var(--space-1) var(--space-2);
      border-radius: 6px;
      background: var(--color-accent);
      color: #fff;
      font-weight: 800;
      font-size: var(--font-body);
    }
    /* The line that introduces the signature block, same as on the paper. */
    .prop-courtesy { margin-top: var(--space-2); line-height: 1.35; }
    .prop-sign {
      margin-top: var(--space-2);
      padding-top: var(--space-1);
      border-top: 1px solid var(--color-border);
      color: var(--color-text-muted);
      font-size: 0.85rem;
    }

    .prop-chips { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-2); }
    /* The way into the document, at the bottom where it no longer stands
       between him and Share. */
    .prop-preview-toggle { margin-bottom: var(--space-2); }

    .prop-actions { display: flex; gap: var(--space-1); margin-top: var(--space-2); }

    /* A one-line prompt at the top of the terms card: a sentence about this
       bid and two ways to answer it. Same shape as an attached strip, because
       it is the same idea — something offered, tied to the card it is about —
       but it belongs to the card rather than to a row he tapped, so it has no
       row to hang off. It never ticks anything on its own. */
    .prop-prompt {
      margin: 0 0 var(--space-2);
      padding: var(--space-2);
      border-left: 3px solid var(--color-accent);
      border-radius: 0 10px 10px 0;
      background: #eef2f7;
    }
    .prop-prompt-text { margin: 0 0 var(--space-2); font-size: 0.95rem; color: var(--color-text); }

    /* THE WAY OUT OF THE CLAUSE LIBRARY, AT THE TOP OF IT. Twenty-seven rows
       put "Done" a screen and a half below the fold, so shutting the list meant
       scrolling past every clause he had already decided about. Sticky under
       the app chrome, the same offset the walk's running tally uses, in the
       strip's own colour so the rows pass behind it — and the shadow paints
       the 12px gap under it in that colour too, or a row would show through in
       a sliver as the list scrolls. */
    .prop-clause-bar {
      position: sticky;
      top: var(--chrome-height);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      padding: var(--space-1) 0;
      background: #eef2f7;
      box-shadow: 0 var(--space-2) 0 #eef2f7;
    }
    .prop-clause-tally { font-weight: 700; color: var(--color-accent); }
    /* Sized to its own word: a full-width Done at the top of the list would be
       a second primary action over a screen that already has Share pinned. */
    .prop-clause-done { flex: 0 0 auto; min-height: 44px; padding: 0 20px; }

    .prop-group { margin-top: var(--space-2); }
    .prop-group-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: var(--space-2);
      margin-bottom: 2px;
    }
    /* The group name and its ticked count are one 48px target that folds the
       group open. A caret alone is a 12px thing to aim at with a thumb. */
    .prop-group-toggle {
      display: flex;
      align-items: baseline;
      gap: var(--space-1);
      flex: 1 1 auto;
      min-width: 0;
      min-height: 48px;
      padding: 0;
      text-align: left;
      background: none;
      border: 0;
      font-family: inherit;
      color: var(--color-text-muted);
    }
    .prop-group-toggle:active { color: var(--color-accent); }
    .prop-group-caret { flex: 0 0 auto; font-size: 0.8rem; }
    /* One line: the group on the left, then how many of it are ticked and the
       All/None control on the right. .link-btn is a full-width block button
       everywhere else in the app, and that width belongs to a card, not to a
       flex row — left alone it pushes the head past the screen (a sideways
       scroll on a 375px phone) and breaks the title onto three lines. The
       group's copy of it is sized to its own text instead. */
    .prop-group-title {
      flex: 1 1 auto;
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 700;
      color: inherit;
      font-size: 0.95rem;
    }
    .prop-group-count { flex: 0 0 auto; color: inherit; font-size: 0.95rem; white-space: nowrap; }
    .prop-group-head .link-btn {
      flex: 0 0 auto;
      width: auto;
      margin-top: 0;
      padding: 0 2px;
      white-space: nowrap;
      text-align: right;
    }
    /* A whole clause line is the tick target: the titles are long and a
       checkbox-sized box beside them is not a thumb-sized thing to hit. */
    .prop-clause {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      width: 100%;
      min-height: 48px;
      padding: var(--space-1);
      text-align: left;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--color-border);
      color: var(--color-text);
      font-size: var(--font-body);
    }
    .prop-clause:active { background: #eef2f7; }
    .prop-tick {
      flex: 0 0 26px;
      height: 26px;
      border: 2px solid var(--color-border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
    }
    .prop-clause-on .prop-tick { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
    .prop-clause-title { min-width: 0; }

    .prop-email {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      margin-top: var(--space-2);
    }
    .prop-email-addr { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; color: var(--color-text-muted); }

    .prop-pdf {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      padding: var(--space-1) 0;
      border-bottom: 1px solid var(--color-border);
    }
    .prop-pdf-when { min-width: 0; overflow-wrap: anywhere; }

    .mt-3 { margin-top: var(--space-3); }
    /* The standard card gap, for a block button that has a card under it. */
    .mb-2 { margin-bottom: var(--space-2); }

    /* ---------- Settings ---------- */
    /* An override is a fact about the row, not a second value, so it rides
       along at the end of the value in small italics rather than taking a
       line of its own. */
    .set-override {
      margin-left: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--color-text-muted);
    }

    /* A plain-string list (did-you-forget, note phrases): the words on the
       left, the small controls on the right. The text wraps; the buttons
       never shrink, because a 44px target that has been squeezed to 20px is
       not a target. */
    .set-list-row {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      min-height: 56px;
      padding: var(--space-1) 0;
      border-bottom: 1px solid var(--color-border);
    }
    .set-list-row:last-of-type { border-bottom: none; }
    .set-list-text { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    .set-list-btns { flex: 0 0 auto; display: flex; gap: 6px; }
    .set-mini {
      min-width: 48px;
      min-height: 48px;
      padding: 0;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .set-mini:active { background: #e2e8f0; }
    .set-mini:disabled { opacity: .35; }

    /* The six category buttons over the parts list, and the five group
       buttons in the clause picker. */
    .set-chips { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-2); }

    /* A clause group's header: name on the left, how many it holds on the
       right, the whole line the tap target. */
    .set-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      width: 100%;
      min-height: 56px;
      padding: var(--space-1) 0;
      text-align: left;
      font-family: inherit;
      font-size: var(--font-body);
      font-weight: 700;
      color: var(--color-text);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--color-border);
    }
    .set-group:active { background: #eef2f7; }
    .set-group-count { flex: 0 0 auto; font-weight: 600; color: var(--color-text-muted); }

    /* A hidden row is on screen only because "Show hidden" is on, and it has
       to read as put away rather than as a live setting. */
    .set-hidden .row-label,
    .set-hidden .row-value,
    .set-hidden .set-list-text { opacity: .55; }

    /* Off-screen but still focusable/clickable — the camera input, which is
       opened by a button rather than shown. display:none would stop the click
       from reaching it. */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- Overlay panels (keypad / text / confirm) ---------- */
    /* Full-screen sheets rather than dialogs: one thing on screen, thumb-sized
       targets, and no native picker anywhere. */
    .panel-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-4) 20px;
      padding-top: calc(var(--space-4) + var(--sai-top));
      padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .panel-overlay[hidden] { display: none; }
    /* Confirm reads as a question, so it sits centered rather than
       keypad-style top-aligned. */
    .panel-center { justify-content: center; }

    .panel-title {
      font-size: var(--font-lg);
      font-weight: 700;
      text-align: center;
    }
    .panel-was {
      color: var(--color-text-muted);
      text-align: center;
      margin-top: 4px;
      font-size: 0.95rem;
    }
    /* One sentence under the question, for the keypads where the question on
       its own is ambiguous -- the rental total being the first of them. */
    .panel-caption {
      color: var(--color-text-muted);
      text-align: center;
      margin-top: 6px;
      font-size: 0.9rem;
      line-height: 1.35;
    }
    /* The typed digits are the dominant element -- what the thumb just did is
       what the eye should land on. */
    .panel-digits {
      text-align: center;
      color: var(--color-text);
      font-size: 2.6rem;
      font-weight: 800;
      min-height: 1.3em;
      margin: var(--space-4) 0 var(--space-3);
      letter-spacing: 0.06em;
    }
    .panel-digits.shake { animation: shake 0.5s; color: var(--color-danger); }
    .panel-keypad { margin: 0 auto var(--space-3); }

    .panel-message {
      font-size: var(--font-lg);
      font-weight: 600;
      text-align: center;
      max-width: 340px;
      margin-bottom: var(--space-4);
    }

    .panel-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-1);
      width: 100%;
      max-width: 340px;
      margin-top: var(--space-3);
    }
    .panel-chips[hidden] { display: none; }

    input.panel-input {
      max-width: 340px;
      margin: var(--space-4) 0 var(--space-3);
      font-size: var(--font-lg);
      min-height: 56px;
    }
    /* The multi-line half of the same prompt. Body size, not --font-lg: a
       scope of work is a paragraph he reads back, and 1.4rem fits four words
       to a line on a phone. */
    textarea.panel-textarea {
      width: 100%;
      max-width: 340px;
      margin: var(--space-3) 0;
      font-family: var(--font);
      font-size: var(--font-body);
      line-height: 1.45;
      min-height: 200px;
      resize: vertical;
    }

    .panel-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      max-width: 340px;
      width: 100%;
      margin: auto auto 0;
    }
    .panel-center .panel-actions { margin: 0 auto; }
    /* The software keyboard covers the bottom of the viewport, so the text
       panel's Done/Cancel ride directly under the input instead. */
    #panel-text .panel-actions { margin: var(--space-3) auto 0; }
    .panel-actions .btn { width: 100%; }

    /* ---------- The calendar panel ---------- */
    /* A month, drawn by hand. There is no native date input in this app and
       none is added: what iOS shows is a spinning wheel of three columns, and
       a man looking for "the Friday" needs to see the week it sits in. Seven
       columns however narrow the phone, every day a 44px target, and the
       keypad he already knows one tap away under it. */
    .cal {
      width: 100%;
      max-width: 340px;
      margin-top: var(--space-3);
    }
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-1);
    }
    .cal-title {
      flex: 1 1 auto;
      text-align: center;
      font-size: var(--font-body);
      font-weight: 700;
    }
    /* The two arrows are the only way to leave the month, so they are full
       targets rather than the little chevrons they look like. */
    .cal-arrow {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      font-size: 1.5rem;
      line-height: 1;
      font-family: inherit;
      color: var(--color-text);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
    }
    .cal-arrow:active { background: #e2e8f0; }

    .cal-week,
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .cal-week {
      margin-top: var(--space-2);
      color: var(--color-text-muted);
      font-size: 0.8rem;
      text-align: center;
    }
    .cal-grid { margin-top: 4px; }

    .cal-day {
      min-height: 44px;
      font-family: inherit;
      font-size: var(--font-body);
      font-weight: 600;
      color: var(--color-text);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 10px;
    }
    .cal-day:active { background: #e2e8f0; }
    /* Today is outlined and the day he has chosen is filled: two different
       facts, so they never wear the same paint. Both at once is a filled cell
       with the heavier border, which is what it should look like. */
    .cal-day.cal-today { border: 2px solid var(--color-accent); }
    .cal-day.cal-on {
      background: var(--color-accent);
      border-color: var(--color-accent);
      color: #ffffff;
    }
    /* The cells before the 1st and after the last. Present so the columns
       cannot shift, and untouchable. */
    .cal-blank {
      visibility: hidden;
      pointer-events: none;
    }
    /* Type it sits under the grid, quiet, the way the keypad's own caption
       link does. */
    .cal-type { margin-top: var(--space-3); }

    /* ---------- Short phones (iPhone SE, 375x667) ---------- */
    /* The keypad panel has to fit without scrolling: the whole point is that
       the thumb can reach every key without moving the phone. */
    @media (max-height: 700px) {
      .key { min-height: 60px; }
      .panel-digits {
        font-size: 2.2rem;
        margin: var(--space-2) 0 var(--space-2);
      }
      .panel-keypad { margin-bottom: var(--space-2); }
    }
  </style>
</head>
<body>
  <div class="chrome">
    <header id="topbar" class="topbar" hidden>
      <button type="button" id="backBtn" class="back-btn" hidden aria-label="Back">&#8249; Back</button>
      <h1 id="topbarTitle" class="topbar-title"></h1>
    </header>

    <div id="banner" class="banner-area" aria-live="polite"></div>
  </div>

  <main>
    <!-- ---------- PIN ---------- -->
    <section id="screen-pin" class="screen">
      <div class="pin-screen">
        <h1 class="app-name">CE Billing</h1>
        <p id="pinMessage" class="pin-message" aria-live="polite">Enter PIN</p>
        <div id="pinDots" class="pin-dots" aria-hidden="true">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <div id="pinKeypad" class="keypad">
          <button type="button" class="key" data-digit="1">1</button>
          <button type="button" class="key" data-digit="2">2</button>
