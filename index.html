<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CE Bids</title>
  <meta name="theme-color" content="#041E42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Chrome deprecated the apple-prefixed form; iOS still reads only that one,
       so both are declared. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CE Bids">
  <link rel="icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      /* Cowboys navy is the one deliberate departure from the timesheet app's
         palette; everything else is identical so the two apps feel like one
         pair in the hand. */
      --color-accent: #041E42;
      --color-accent-dark: #02132b;
      --color-confirm: #15803d;
      --color-danger: #b91c1c;
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-text: #0f172a;
      --color-text-muted: #475569;
      --color-border: #cbd5e1;
      --color-warn-bg: #fef3c7;
      --color-warn-border: #f59e0b;
      --color-warn-text: #92400e;
      --color-chart-guide: #94a3b8;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --space-1: 8px;
      --space-2: 12px;
      --space-3: 16px;
      --space-4: 24px;
      --space-5: 32px;
      --font-body: 1.1rem;
      --font-lg: 1.4rem;
      --font-xl: 2rem;
      /* Height reserved at the bottom of every screen for the tab bar. */
      --tabbar-height: 64px;
      /* The notch/status-bar inset, behind a variable so a test can inject a
         real device value on a desktop browser. */
      --sai-top: env(safe-area-inset-top, 0px);
      /* The sticky top bar's height, so anything that has to stick UNDER it
         reads the same number the bar is built from rather than guessing. */
      --chrome-height: calc(56px + var(--sai-top));
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    h1, h2, h3, p { margin: 0; }

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ---------- Chrome (top bar + banners) ---------- */
    /* One sticky block rather than two independently-stuck elements: the
       banner area used to offset itself by the top bar's height, which was
       wrong by exactly the safe-area inset on a notched phone (a 21px gap of
       scrolling content showing through under the bar). Sticking the pair
       together means there is no offset to get wrong. */
    .chrome {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--color-bg);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      /* 4px padding + a 48px back button = 56px, and min-height carries the
         title-only state to the same 56px, so the chrome does not change
         height as the owner moves between screens. The inset has to be inside
         min-height or the title-only bar comes up short by exactly the notch
         (82px vs 103px on an iPhone 14 Pro). */
      min-height: var(--chrome-height);
      padding: 4px var(--space-2);
      padding-top: calc(4px + var(--sai-top));
      background: var(--color-accent);
      color: #ffffff;
    }
    .topbar[hidden] { display: none; }

    .back-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      min-width: 48px;
      min-height: 48px;
      padding: 0 10px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .back-btn:active { background: rgba(255, 255, 255, 0.18); }
    .back-btn[hidden] { display: none; }

    .topbar-title {
      flex: 1;
      min-width: 0;
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      padding-right: 48px; /* balance the back button so the title stays visually centered */
      /* A title naming the thing the screen was opened for can be as long as
         he wants to type. It trims rather than wrapping the bar to two lines. */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------- Banners ---------- */
    /* Sits directly under the top bar. Persistent banners (storage corrupt)
       stay until clearBanner(); transient ones carry a dismiss X and clear
       themselves after a few seconds. */
    /* Inside .chrome, so a failed save on a long screen is visible where the
       thumb already is rather than only at scroll-top — and without the app
       scrolling the page back to the top and losing the owner's place. */
    .banner-area {
      padding: 0 20px;
      background: var(--color-bg);
    }
    .banner-area:empty { display: none; }
    /* Padding, not a margin on the first banner: a child margin collapses out
       through the area and .chrome, which would put a 16px seam between the
       top bar and the banner block instead of inside it. */
    .banner-area:not(:empty) { padding-top: var(--space-3); }

    .banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      border-radius: 12px;
      padding: var(--space-2) var(--space-3);
      margin-bottom: var(--space-2);
      font-size: 0.95rem;
      background: var(--color-warn-bg);
      border: 1px solid var(--color-warn-border);
      color: var(--color-warn-text);
    }
    .banner-danger {
      background: rgba(185, 28, 28, 0.1);
      border-color: var(--color-danger);
      color: var(--color-danger);
    }
    .banner-ok {
      background: rgba(21, 128, 61, 0.1);
      border-color: var(--color-confirm);
      color: var(--color-confirm);
    }
    .banner-text { flex: 1; }
    .banner-dismiss {
      min-width: 44px;
      min-height: 44px;
      border: none;
      background: transparent;
      color: inherit;
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: 10px;
    }
    .banner-dismiss:active { background: rgba(15, 23, 42, 0.1); }

    /* ---------- Screens ---------- */
    .screen[hidden] { display: none; }

    /* Scrollable content area for every real screen. Bottom padding clears
       both the tab bar and the home indicator. */
    .screen-content {
      padding: var(--space-4) 20px;
      padding-bottom: calc(var(--space-4) + var(--tabbar-height) + env(safe-area-inset-bottom));
    }

    .screen-placeholder {
      font-size: var(--font-body);
      color: var(--color-text-muted);
    }

    /* ---------- Bottom tab bar ---------- */
    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      display: flex;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tabbar[hidden] { display: none; }
    .tab {
      flex: 1;
      min-height: var(--tabbar-height);
      border: none;
      background: transparent;
      color: var(--color-text-muted);
      font-size: 1.05rem;
      font-weight: 600;
    }
    .tab:active { background: #eef2f7; }
    .tab-active { color: var(--color-accent); box-shadow: inset 0 3px 0 var(--color-accent); }

    /* ---------- PIN screen ---------- */
    .pin-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: var(--space-5) var(--space-4);
      padding-top: calc(var(--space-5) + var(--sai-top));
      padding-bottom: calc(var(--space-5) + env(safe-area-inset-bottom));
      gap: 28px;
      text-align: center;
    }

    .app-name {
      font-size: var(--font-xl);
      font-weight: 800;
      color: var(--color-accent);
      letter-spacing: -0.02em;
    }

    .pin-message {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--color-text-muted);
      min-height: 1.5em;
    }

    /* Shown only after three wrong tries. There is no recovery path by design
       (same policy as CE Timesheets) -- this is text, not a button. */
    .pin-hint {
      font-size: 0.95rem;
      color: var(--color-text-muted);
      max-width: 320px;
    }
    .pin-hint[hidden] { display: none; }
    .pin-cancel { min-width: 200px; }
    .pin-cancel[hidden] { display: none; }

    .pin-dots {
      display: flex;
      gap: 18px;
    }

    .dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid var(--color-accent);
      background: transparent;
      transition: background-color 0.15s ease;
    }
    .dot.filled { background: var(--color-accent); }

    @keyframes shake {
      10%, 90% { transform: translateX(-4px); }
      20%, 80% { transform: translateX(8px); }
      30%, 50%, 70% { transform: translateX(-14px); }
      40%, 60% { transform: translateX(14px); }
    }
    /* ui.js shake() puts this class on whatever element got it wrong: a form
       row, the PIN dots, the typed digits. The animation is generic and the
       two rules below only add color on top of it. */
    .shake { animation: shake 0.5s; }
    .pin-dots.shake { animation: shake 0.5s; }
    .pin-dots.shake .dot { border-color: var(--color-danger); }

    /* ---------- Keypad (shared by the PIN screen and the number panel) ---------- */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 340px;
    }

    .key {
      min-height: 68px;
      font-size: 1.6rem;
      font-weight: 600;
      border-radius: 14px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    .key:active { background: #e2e8f0; }

    .key-blank {
      visibility: hidden;
      pointer-events: none;
      border: none;
      box-shadow: none;
      background: transparent;
    }

    .key-back {
      color: var(--color-danger);
      font-size: 1.4rem;
    }

    /* ---------- Shared building blocks ---------- */
    .btn {
      min-height: 48px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      padding: var(--space-2) 18px;
    }
    .btn-primary { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
    .btn-confirm { background: var(--color-confirm); border-color: var(--color-confirm); color: #fff; }
    .btn-danger { background: var(--color-danger); border-color: var(--color-danger); color: #fff; }
    .btn-danger-outline { background: transparent; border-color: var(--color-danger); color: var(--color-danger); }
    .btn-block { display: block; width: 100%; text-align: center; }
    /* A two-state button that is ON. Not a primary action — pressing it turns
       the thing OFF — so it wears the accent as a state, not as a promise. */
    .btn-on { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
    /* A button that is off is off: a live-looking control that does nothing is
       worse than a dim one that explains itself in the caption underneath. */
    .btn:disabled { opacity: .45; cursor: default; }

    input[type="text"] {
      min-height: 48px;
      font-size: var(--font-body);
      font-family: inherit;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      padding: 0 var(--space-2);
      width: 100%;
    }
    textarea {
      font-size: var(--font-body);
      font-family: inherit;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      padding: var(--space-1) var(--space-2);
      width: 100%;
    }
    input[type="text"]:focus,
    textarea:focus { outline: 2px solid var(--color-accent); outline-offset: 1px; }

    /* The search field, on the walk and on the home screen. The X sits INSIDE
       the field on the right, so the field keeps the full width and the tap
       target is where a phone keyboard has taught him to look for it. */
    .search-wrap { position: relative; }
    .search-input { padding-right: 52px; }
    .search-clear {
      position: absolute;
      top: 0;
      right: 0;
      width: 48px;
      height: 100%;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--color-text-muted);
      font-size: 1.1rem;
      line-height: 1;
      border-radius: 10px;
    }
    .search-clear:active { color: var(--color-text); }
    .search-clear[hidden] { display: none; }
    input.field-invalid { border-color: var(--color-danger); outline-color: var(--color-danger); }

    .section-heading {
      font-size: var(--font-lg);
      font-weight: 700;
      margin: var(--space-4) 0 var(--space-2);
    }
    .section-heading:first-child { margin-top: 0; }

    .empty-state {
      font-size: var(--font-body);
      color: var(--color-text-muted);
      padding: var(--space-4) 0;
      text-align: center;
    }

    /* The muted line under the thing it explains. Sits beside real content,
       where .empty-state stands in for content that isn't there. */
    .caption {
      margin: 2px 0 var(--space-1);
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }

    /* The same line when what it says is a problem: how long it has been since
       the last backup, past the point where that is news. Red and bold, so it
       stops being furniture. */
    .caption-danger { color: var(--color-danger); font-weight: 700; }

    /* The build stamp at the very bottom of Settings. Centered and quiet: it is
       reference, not something to read on the way past. */
    .app-version { margin-top: var(--space-4); text-align: center; }

    /* The line at the top of a screen that says which bid he is looking at.
       Costs & price and Proposal both print it, so it is one rule and not two:
       the title, then the customer under it in muted type. */
    .screen-head { margin-bottom: var(--space-3); }
    .screen-head-title { font-size: var(--font-lg); font-weight: 800; }
    .screen-head-cust { margin-top: 2px; font-size: var(--font-body); color: var(--color-text-muted); }

    /* ---------- Shared components (built by ui.js) ---------- */
    .card {
      display: block;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: var(--space-3);
      margin-bottom: var(--space-2);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-text-muted);
      margin-bottom: var(--space-2);
    }

    /* A row is the whole tap target — no small pencil icons to aim at. */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      width: 100%;
      min-height: 56px;
      padding: var(--space-1) 0;
      text-align: left;
      font-family: inherit;
      font-size: var(--font-body);
      color: var(--color-text);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--color-border);
    }
    .row:last-child { border-bottom: none; }
    .row-tap:active { background: #eef2f7; }
    .row-label { color: var(--color-text-muted); }
    .row-value { font-weight: 700; text-align: right; }

    .chip {
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1.5px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 0.95rem;
      font-weight: 600;
    }
    .chip-selected {
      border-color: var(--color-accent);
      background: var(--color-accent);
      color: #fff;
    }

    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: #e2e8f0;
      color: var(--color-text-muted);
    }
    .pill-sent { background: rgba(4, 30, 66, 0.12); color: var(--color-accent); }
    .pill-won { background: rgba(21, 128, 61, 0.12); color: var(--color-confirm); }
    .pill-lost { background: rgba(185, 28, 28, 0.1); color: var(--color-danger); }
    .pill-complete { background: var(--color-accent); color: #fff; }

    /* ---------- Bids home ---------- */
    /* The nudge bands: the two things that cost real money when they are
       missed (a proposal nobody answered, work that only exists inside this
       phone), said in a sentence and tappable straight through to the fix. */
    .nudges {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }
    .nudge {
      width: 100%;
      min-height: 56px;
      padding: var(--space-2) var(--space-3);
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.35;
      text-align: left;
      background: var(--color-warn-bg);
      border: 1px solid var(--color-warn-border);
      color: var(--color-warn-text);
    }
    .nudge-danger {
      background: rgba(185, 28, 28, 0.1);
      border-color: var(--color-danger);
      color: var(--color-danger);
    }
    .nudge:active { filter: brightness(0.96); }
    /* The band is a toggle, so it has to look pressed while its filter is on. */
    .nudge-on { box-shadow: inset 0 0 0 2px currentColor; }

    .bids-search { margin-bottom: var(--space-3); }
    .walk-search { margin-bottom: var(--space-2); }

    .bid-card {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      margin-bottom: var(--space-2);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    /* The card holds a second button, so it is a container and the tap target
       is the button filling it. A button inside a button is not a thing. */
    .bid-main {
      flex: 1;
      min-width: 0;
      min-height: 72px;
      padding: var(--space-2) var(--space-3);
      border: none;
      border-radius: 12px 0 0 12px;
      background: transparent;
      font-family: inherit;
      color: var(--color-text);
      text-align: left;
    }
    .bid-main:active { background: #eef2f7; }
    /* A long press on this row opens the app's own menu. Without these, iOS
       answers the same gesture with its native callout and a text selection
       over the customer name, and the owner gets two menus fighting. */
    .bid-main {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .bid-line1 { font-size: var(--font-body); font-weight: 700; }
    .bid-line2 {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-1);
      margin-top: 6px;
      font-size: 0.95rem;
      color: var(--color-text-muted);
    }
    .bid-price { font-weight: 700; color: var(--color-text); }
    .bid-number { margin-left: auto; }
    .bid-more {
      width: 52px;
      min-height: 72px;
      border: none;
      border-radius: 0 12px 12px 0;
      background: transparent;
      color: var(--color-text-muted);
      font-size: 1.5rem;
    }
    .bid-more:active { background: #eef2f7; }
    .bid-actions {
      flex: 1 0 100%;
      display: flex;
      gap: var(--space-2);
      padding: 0 var(--space-3) var(--space-2);
    }
    .bid-actions .btn { flex: 1; }

    /* Pinned above the tab bar: with thirty bids in the list, the one button
       the owner reaches for must never be a scroll away. */
    .bids-newbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--tabbar-height) + env(safe-area-inset-bottom));
      z-index: 15;
      padding: var(--space-2) 20px;
      background: var(--color-bg);
      border-top: 1px solid var(--color-border);
    }
    .bids-newbar .btn { min-height: 56px; font-size: 1.15rem; }
    /* Clears the tab bar AND the pinned button sitting above it. */
    #bidsContent { padding-bottom: calc(var(--space-4) + var(--tabbar-height) + 84px + env(safe-area-inset-bottom)); }

    /* ---------- Bid screen and header form ---------- */
    .field-label {
      margin: var(--space-3) 0 var(--space-1);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-text-muted);
    }
    /* Two or three big buttons side by side: this app's answer to a dropdown. */
    .toggle-row { display: flex; gap: var(--space-1); }
    /* min-width:0 so flex-basis:0 actually wins: a flex item's automatic
       minimum is its content width, which would make "Scope & price"
       claim more room than "Full" and leave the row visibly lopsided. */
    .chip-lg { flex: 1 1 0; min-width: 0; min-height: 56px; padding: 0 8px; font-size: 1.05rem; line-height: 1.2; }
    .btn-half { flex: 1; min-height: 56px; }

    .inline-warn {
      margin-top: 4px;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      background: var(--color-warn-bg);
      border: 1px solid var(--color-warn-border);
      color: var(--color-warn-text);
    }

    .bid-head-name { font-size: var(--font-lg); font-weight: 800; }
    .bid-head-title { margin-top: 2px; font-size: var(--font-body); color: var(--color-text-muted); }
    .bid-head-price { margin-top: var(--space-2); font-size: var(--font-xl); font-weight: 800; }
    .bid-head-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-2);
      color: var(--color-text-muted);
    }

    /* "Edit details" is a secondary route, not a fifth big button competing
       with the ones that matter, but it still gets a 44px target. */
    .link-btn {
      display: block;
      width: 100%;
      min-height: 44px;
      margin-top: var(--space-2);
      padding: 0;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      color: var(--color-accent);
      text-align: left;
    }

    .bid-nav {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }
    .bid-nav .btn { min-height: 60px; font-size: 1.15rem; }

    /* ---------- The walk ---------- */
    /* One screen, three views (areas / one area / adding an item), plus two
       full-screen overlays of its own: the photo viewer and the small
       rental-or-equipment sheet. Both sit above the tab bar at z-index 90 and
       below the shell's panels at 100, so a keypad opened from a sheet still
       covers it. */
    .walk-head { margin-bottom: var(--space-3); }
    .walk-head-title { font-size: var(--font-lg); font-weight: 800; }
    .walk-head-cust { margin-top: 2px; font-size: var(--font-body); color: var(--color-text-muted); }

    /* A two-line version of .row: a name and its money on the first line, the
       counts underneath. The whole block is the tap target. */
    .walk-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      min-height: 60px;
      padding: var(--space-1) 0;
      text-align: left;
      font-family: inherit;
      font-size: var(--font-body);
      color: var(--color-text);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--color-border);
    }
    .walk-row:last-child { border-bottom: none; }
    button.walk-row:active { background: #eef2f7; }
    .walk-row-text { flex: 1; min-width: 0; }
    .walk-row-name { font-weight: 700; }
    .walk-row-sub { margin-top: 2px; font-size: 0.9rem; color: var(--color-text-muted); }
    .walk-row-value { font-weight: 700; white-space: nowrap; }
    /* The line he just added, for about a second — on a list of twenty parts,
       "did that go in?" is answered without reading. */
    .walk-row-new { animation: walk-flash 1s ease-out; }
    @keyframes walk-flash {
      from { background: rgba(21, 128, 61, 0.22); }
      to { background: transparent; }
    }

    .walk-item-actions {
      display: flex;
      gap: var(--space-1);
      padding: 0 0 var(--space-2);
      border-bottom: 1px solid var(--color-border);
    }
    .walk-item-actions .btn { flex: 1; min-height: 48px; padding: 0 8px; font-size: 0.95rem; }

    .walk-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
    .walk-tile {
      min-height: 88px;
      padding: var(--space-2);
      border-radius: 12px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--color-text);
    }
    .walk-tile:active { background: #eef2f7; }

    /* The running total at the top of the add list: quiet, but the only proof
       that the last eight taps landed. It STICKS: the proof is worth nothing
       eleven rows down a parts list, which is exactly where his thumb is by
       the time he needs it. Under the chrome (which is sticky at 0 and opaque)
       and over the rows, with the list's own background so a row sliding
       beneath it does not read through. */
    .walk-tally {
      position: sticky;
      top: var(--chrome-height);
      z-index: 5;
      margin-bottom: var(--space-2);
      /* The 12px gap under it is page, not strip, so a row would show through
         it in a thin sliver as the list scrolls past. The shadow paints that
         gap in the page's own colour, which is the whole of what it is for. */
      box-shadow: 0 var(--space-2) 0 var(--color-bg);
      padding: var(--space-1) var(--space-2);
      border-radius: 10px;
      background: #eef2f7;
      color: var(--color-accent);
      font-weight: 700;
    }

    .walk-thumbs { display: flex; flex-wrap: wrap; gap: var(--space-1); }
    .walk-thumb {
      width: 88px;
      height: 88px;
      padding: 0;
      overflow: hidden;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: #e2e8f0;
    }
    .walk-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* Full-size photo: dark ground, because a photo of a dim mechanical room
       read against white is a photo he can't see. */
    .walk-photo-view {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: flex;
      flex-direction: column;
      background: #0f172a;
      padding: calc(var(--space-3) + var(--sai-top)) var(--space-3);
      padding-bottom: calc(var(--space-3) + env(safe-area-inset-bottom));
    }
    .walk-photo-view img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
    .walk-photo-actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); }
    .walk-photo-actions .btn { flex: 1; min-height: 56px; }

    .walk-sheet {
      position: fixed;
      inset: 0;
      z-index: 90;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--color-bg);
      padding: calc(var(--space-4) + var(--sai-top)) 20px;
      padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom));
    }

    .walk-forget {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: 56px;
      border-bottom: 1px solid var(--color-border);
    }
    .walk-forget:last-child { border-bottom: none; }
    .walk-forget-label { flex: 1; min-width: 0; }
    .walk-forget-actions { display: flex; gap: var(--space-1); }
    /* Two buttons on one line still get a full-size target: he is answering
       seven of these in a row with a work glove half off. */
    .walk-forget-actions .btn { min-height: 56px; padding: 0 16px; font-size: 0.95rem; }
    /* Answered, and still a control: tapping it puts the question back. */
    .walk-forget-tick {
      min-height: 56px;
      padding: 0 12px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-confirm);
    }
    /* "Which area?" hangs under the row that asked it, indented and tinted so
       it reads as part of that row and not as the next one. */
    .walk-forget-areas {
      padding: var(--space-2) 0 var(--space-2) var(--space-2);
      margin-bottom: var(--space-2);
      border-left: 3px solid var(--color-border);
      background: var(--color-bg);
    }
    .walk-forget-chips { display: flex; flex-wrap: wrap; gap: var(--space-1); }

    /* ---------- Labor ---------- */
    /* One line — crew chips and a day count — or the same pair once per task.
       The readout under it is the only place on the screen that is not a
       control, so it is deliberately plain. */
    .labor-head { margin-bottom: var(--space-3); }
    .labor-head-title { font-size: var(--font-lg); font-weight: 800; }
    .labor-head-cust { margin-top: 2px; font-size: var(--font-body); color: var(--color-text-muted); }

    /* Chips wrap: a five-man crew must not push the fifth name off the edge. */
    .labor-chips { display: flex; flex-wrap: wrap; gap: var(--space-1); }

    /* The number he came here to type, at the size of the answer it gives. */
    .labor-days .row-value { font-size: var(--font-xl); font-weight: 800; }

    /* The captions sit between the rows, so :last-child never lands on the
       bottom row and its divider would otherwise hang under nothing. */
    .labor-readout .row { border-bottom: none; }
    .labor-readout .row-value { font-weight: 800; }

    .labor-warn-actions { display: flex; gap: var(--space-1); margin-top: var(--space-1); }
    /* The one way out of a state that is blocking every save on the bid — a
       full-size target, not a 44px afterthought. */
    .labor-warn-actions .btn { min-height: 56px; padding: 0 18px; }

    /* A real row that goes somewhere, not grey text: it opens a confirmation
       and then a keypad, and it changes every bid in the file. */
    .labor-hpd .row-value { color: var(--color-accent); font-weight: 700; }
    .labor-hpd-chevron {
      padding-left: 8px;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--color-accent);
    }

    .labor-task-actions { display: flex; margin-top: var(--space-2); }
    .labor-task-actions .btn { flex: 1; min-height: 48px; }
    /* The task he just added, for about a second — same flash the walk uses on
       a part, for the same reason: "did that go in?" answered without reading. */
    .labor-task-new { animation: walk-flash 1s ease-out; }

    /* ---------- Costs & price ---------- */
    /* Three cards down one column: the costs that aren't material or labor,
       what the job costs him, and what he sells it for. The cost stack is his
       eyes only and never prints. */
    /* The screen's title line is .screen-head, up in the shared blocks — the
       proposal screen prints the same one. */

    /* A rental or a piece of equipment: name and money on top, the small
       controls underneath. Same shape as a walk row, with chips instead of a
       second line of text — days, marked up, and the ⋯ are all separate
       answers and each one needs its own target. */
    .price-line { padding: var(--space-1) 0; border-bottom: 1px solid var(--color-border); }
    .price-line:last-child { border-bottom: none; }
    .price-line-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      width: 100%;
      min-height: 48px;
      padding: 0;
      text-align: left;
      font-family: inherit;
      font-size: var(--font-body);
      color: var(--color-text);
      background: transparent;
      border: none;
    }
    .price-line-tap:active { background: #eef2f7; }
    .price-line-name { font-weight: 700; min-width: 0; }
    .price-line-value { font-weight: 700; white-space: nowrap; }
    .price-line-sub { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: 4px; }
    /* Wraps, because "$/day for this bid" and two more will not sit on one
       390px line and a button squeezed to four characters is a button he
       cannot read. Same shape as the Settings strip. */
    .price-line-actions { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-1); }
    .price-line-actions .btn { flex: 1 1 40%; min-height: 48px; padding: 0 12px; }

    /* The tool picker's chips, shared with the walk's rental/equipment sheet. */
    .equip-chips { display: flex; flex-wrap: wrap; gap: var(--space-1); }

    /* A yellow chip is a line that is not priced yet: it is the same warning
       color as .inline-warn, because it is the same kind of news. */
    .chip-warn {
      border-color: var(--color-warn-border);
      background: var(--color-warn-bg);
      color: var(--color-warn-text);
    }
    /* A fact about the line, shaped like a chip so it sits in the same row.
       A <span>, not a disabled button: there is nothing to press, and it must
       not read as a control that refuses every tap. */
    .chip-fact { display: inline-flex; align-items: center; }
    .chip-flat { border-style: dashed; color: var(--color-text-muted); }
    .chip-more { min-width: 56px; padding: 0 14px; font-size: 1.1rem; }
    .chip:disabled { opacity: .55; }

    /* A row that reaches past this bid. Color alone is a hint, and a hint is
       not a warning — so the reach is also written on the row, in words. */
    .price-settings-row .row-value { color: var(--color-accent); font-weight: 700; }
    .price-tag {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: .02em;
      white-space: nowrap;
      background: rgba(4, 30, 66, 0.1);
      color: var(--color-accent);
    }
    .price-truecost { font-size: 1.2rem; }
    .price-truecost .row-label, .price-truecost .row-value { font-weight: 800; color: var(--color-text); }

    /* The three handles, at the size of the answer they give. */
    .price-handles .row-value { font-size: var(--font-xl); font-weight: 800; }
    /* Off means "you can't move this yet", not "you can't read this": the
       label and the tap affordance go quiet, the money stays fully legible —
       it is still the price of the job. */
    .price-row-off .row-label { opacity: .45; }
    .price-pills { display: flex; gap: var(--space-1); margin: var(--space-1) 0 var(--space-2); }
    .price-pills .chip { flex: 1 1 0; min-width: 0; padding: 0 8px; }

    /* Sentences, not controls: whether the number above is one to say out loud. */
    .price-note { margin: 0 0 var(--space-1); font-size: var(--font-body); line-height: 1.35; }
    .price-note-bad { font-weight: 700; color: var(--color-danger); }
    .price-readout .row { min-height: 44px; }

    /* ---------- Bars ---------- */
    /* The only chart in the app: how much of a thing is gone. The fill stops
       at full and turns red past it, and the line underneath says by how much.
       The job screen burns hours against it, Reports burns hours, surprises,
       wins and margin against it, and there is one of these, not five. */
    .bar {
      height: 12px;
      border-radius: 999px;
      background: rgba(4, 30, 66, 0.12);
      overflow: hidden;
      margin: var(--space-2) 0 var(--space-1);
    }
    .bar-fill { height: 100%; border-radius: 999px; background: var(--color-accent); }
    .bar-over { background: var(--color-danger); }

    /* ---------- Job (Task 12) ---------- */
    /* The week he is looking at, with a way either side of it. Both arrows are
       full-height targets: this gets tapped with a glove on. */
    .job-weeknav { display: flex; align-items: center; gap: var(--space-1); margin-bottom: var(--space-1); }
    .job-weeknav-label { flex: 1; min-width: 0; text-align: center; font-weight: 700; }
    .job-weeknav-btn { min-width: 64px; padding: 0; font-size: 1.2rem; }
    .job-weeknav-btn:disabled { opacity: .35; }

    /* The number he came here to type, at the size of the answer it gives. */
    .job-hours .row-value { font-size: var(--font-xl); font-weight: 800; }

    .job-actions { display: flex; flex-wrap: wrap; gap: var(--space-1); margin: var(--space-1) 0 var(--space-2); }
    .job-actions .btn { flex: 1 1 auto; min-height: 52px; }

    .job-done { margin-bottom: var(--space-3); font-weight: 700; color: var(--color-confirm); }

    /* The card this whole app is for. Navy, so it reads as the answer to the
       job rather than as one more list of rows. */
    .job-actual { background: var(--color-accent); border-color: var(--color-accent-dark); }
    .job-actual .card-title { color: rgba(255, 255, 255, 0.75); }
    .job-actual .row { color: #fff; border-bottom-color: rgba(255, 255, 255, 0.18); }
    .job-actual .row-label { color: rgba(255, 255, 255, 0.75); }
    .job-actual .row-value { color: #fff; font-weight: 800; }
    .job-actual .caption { color: rgba(255, 255, 255, 0.7); }
    /* Green is "still the job you sold"; red is "it is costing you the
       margin". Both are legible on navy, which the app's own two greens and
       reds are not. */
    .job-actual .job-good .row-value { color: #86efac; }
    .job-actual .job-bad .row-value { color: #fca5a5; }

    /* ---------- Reports (Task 15) ---------- */
    /* Four readings on one card, each one a heading, a number, a bar and a
       sentence in his own words. The sentence is the point: a percentage he
       has to interpret is a percentage he will not use. */
    .rep-stat { margin-top: var(--space-4); }
    .rep-stat:first-of-type { margin-top: 0; }
    .rep-headline .row-value { font-size: var(--font-lg); font-weight: 800; }
    /* The plain-English line under each stat. Bigger than a caption, because
       it is the part he reads. */
    .rep-says { margin: var(--space-1) 0 0; font-size: var(--font-body); line-height: 1.35; }
    /* Green is "still the job you sold", red is "it cost you the margin" — the
       same rule as the job card, on white instead of navy. */
    .rep-good .row-value { color: var(--color-confirm); }
    .rep-bad .row-value { color: var(--color-danger); }

    /* ---------- Utilities ---------- */
    /* ---------- Proposal (Task 11) ---------- */
    /* The preview is a piece of paper on a phone: white, boxed, and set a size
       smaller than the app around it so it reads as the document rather than
       as more of the screen. Every number in it is BidMath.fmt's. */
    .prop-preview {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: var(--space-2);
      font-size: 0.95rem;
      margin-top: var(--space-1);
    }
    .prop-doc-head { border-bottom: 2px solid var(--color-accent); padding-bottom: var(--space-1); }
    .prop-co { font-size: var(--font-body); font-weight: 800; color: var(--color-accent); }
    .prop-co-sub { color: var(--color-text-muted); font-size: 0.85rem; margin-top: 2px; }
    .prop-meta { margin-top: var(--space-1); }
    .prop-meta-row {
      display: flex;
      justify-content: space-between;
      gap: var(--space-2);
      padding: 1px 0;
    }
    .prop-meta-row span:first-child { color: var(--color-text-muted); }
    .prop-meta-row span:last-child { font-weight: 600; text-align: right; }
    .prop-doc-title { margin-top: var(--space-1); font-weight: 700; }
    .prop-sec-title {
      margin-top: var(--space-2);
      padding: 3px var(--space-1);
      background: #f1f5f9;
      color: var(--color-accent);
      font-weight: 700;
      border-radius: 4px;
    }
    /* Baseline, not center: a description that wraps to two lines must not
       drag its price down to sit between them. */
    .prop-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: var(--space-2);
      padding: 3px 0;
      border-bottom: 1px solid var(--color-border);
    }
    /* Two lines, not a wrap: what it is, then how many at what each. Run
       together they wrapped on a 375px phone and left the unit price sitting
       under the row's own total, reading as the same number twice. */
    .prop-line-desc { min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; }
    .prop-line-sub { color: var(--color-text-muted); font-size: 0.85rem; }
    .prop-line-money { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .prop-bullets { margin: var(--space-1) 0 0; padding-left: 20px; }
    .prop-bullets li { padding: 2px 0; overflow-wrap: anywhere; }
    /* The one number he must not have to hunt for, at all three levels. */
    .prop-total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: var(--space-2);
      padding: var(--space-1) var(--space-2);
      border-radius: 6px;
      background: var(--color-accent);
      color: #fff;
      font-weight: 800;
      font-size: var(--font-body);
    }
    /* The line that introduces the signature block, same as on the paper. */
    .prop-courtesy { margin-top: var(--space-2); line-height: 1.35; }
    .prop-sign {
      margin-top: var(--space-2);
      padding-top: var(--space-1);
      border-top: 1px solid var(--color-border);
      color: var(--color-text-muted);
      font-size: 0.85rem;
    }

    .prop-chips { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-2); }
    .prop-actions { display: flex; gap: var(--space-1); margin-top: var(--space-2); }

    .prop-group { margin-top: var(--space-2); }
    .prop-group-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: var(--space-2);
      margin-bottom: 2px;
    }
    /* One line: the group on the left, then how many of it are ticked and the
       All/None control on the right. .link-btn is a full-width block button
       everywhere else in the app, and that width belongs to a card, not to a
       flex row — left alone it pushes the head past the screen (a sideways
       scroll on a 375px phone) and breaks the title onto three lines. The
       group's copy of it is sized to its own text instead. */
    .prop-group-title {
      flex: 1 1 auto;
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 700;
      color: var(--color-text-muted);
      font-size: 0.95rem;
    }
    .prop-group-count { flex: 0 0 auto; color: var(--color-text-muted); font-size: 0.95rem; white-space: nowrap; }
    .prop-group-head .link-btn {
      flex: 0 0 auto;
      width: auto;
      margin-top: 0;
      padding: 0 2px;
      white-space: nowrap;
      text-align: right;
    }
    /* A whole clause line is the tick target: the titles are long and a
       checkbox-sized box beside them is not a thumb-sized thing to hit. */
    .prop-clause {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      width: 100%;
      min-height: 48px;
      padding: var(--space-1);
      text-align: left;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--color-border);
      color: var(--color-text);
      font-size: var(--font-body);
    }
    .prop-clause:active { background: #eef2f7; }
    .prop-tick {
      flex: 0 0 26px;
      height: 26px;
      border: 2px solid var(--color-border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
    }
    .prop-clause-on .prop-tick { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
    .prop-clause-title { min-width: 0; }

    .prop-email {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      margin-top: var(--space-2);
    }
    .prop-email-addr { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; color: var(--color-text-muted); }

    .prop-pdf {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      padding: var(--space-1) 0;
      border-bottom: 1px solid var(--color-border);
    }
    .prop-pdf-when { min-width: 0; overflow-wrap: anywhere; }

    .mt-3 { margin-top: var(--space-3); }

    /* ---------- Settings ---------- */
    /* An override is a fact about the row, not a second value, so it rides
       along at the end of the value in small italics rather than taking a
       line of its own. */
    .set-override {
      margin-left: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--color-text-muted);
    }

    /* A plain-string list (did-you-forget, note phrases): the words on the
       left, the small controls on the right. The text wraps; the buttons
       never shrink, because a 44px target that has been squeezed to 20px is
       not a target. */
    .set-list-row {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      min-height: 56px;
      padding: var(--space-1) 0;
      border-bottom: 1px solid var(--color-border);
    }
    .set-list-row:last-of-type { border-bottom: none; }
    .set-list-text { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    .set-list-btns { flex: 0 0 auto; display: flex; gap: 6px; }
    .set-mini {
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .set-mini:active { background: #e2e8f0; }
    .set-mini:disabled { opacity: .35; }
    .set-mini-danger { color: var(--color-danger); }

    /* The six category buttons over the parts list, and the five group
       buttons in the clause picker. */
    .set-chips { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-2); }

    /* A clause group's header: name on the left, how many it holds on the
       right, the whole line the tap target. */
    .set-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      width: 100%;
      min-height: 56px;
      padding: var(--space-1) 0;
      text-align: left;
      font-family: inherit;
      font-size: var(--font-body);
      font-weight: 700;
      color: var(--color-text);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--color-border);
    }
    .set-group:active { background: #eef2f7; }
    .set-group-count { flex: 0 0 auto; font-weight: 600; color: var(--color-text-muted); }

    /* A hidden row is on screen only because "Show hidden" is on, and it has
       to read as put away rather than as a live setting. */
    .set-hidden .row-label,
    .set-hidden .row-value,
    .set-hidden .set-list-text { opacity: .55; }

    .set-actions { display: flex; flex-wrap: wrap; gap: var(--space-1); margin: 0 0 var(--space-2); }
    .set-actions .btn { flex: 1 1 40%; min-height: 48px; padding: 0 12px; }

    /* Off-screen but still focusable/clickable — the camera input, which is
       opened by a button rather than shown. display:none would stop the click
       from reaching it. */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- Overlay panels (keypad / text / confirm) ---------- */
    /* Full-screen sheets rather than dialogs: one thing on screen, thumb-sized
       targets, and no native picker anywhere. */
    .panel-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-4) 20px;
      padding-top: calc(var(--space-4) + var(--sai-top));
      padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .panel-overlay[hidden] { display: none; }
    /* Confirm reads as a question, so it sits centered rather than
       keypad-style top-aligned. */
    .panel-center { justify-content: center; }

    .panel-title {
      font-size: var(--font-lg);
      font-weight: 700;
      text-align: center;
    }
    .panel-was {
      color: var(--color-text-muted);
      text-align: center;
      margin-top: 4px;
      font-size: 0.95rem;
    }
    /* One sentence under the question, for the keypads where the question on
       its own is ambiguous -- the rental total being the first of them. */
    .panel-caption {
      color: var(--color-text-muted);
      text-align: center;
      margin-top: 6px;
      font-size: 0.9rem;
      line-height: 1.35;
    }
    /* The typed digits are the dominant element -- what the thumb just did is
       what the eye should land on. */
    .panel-digits {
      text-align: center;
      color: var(--color-text);
      font-size: 2.6rem;
      font-weight: 800;
      min-height: 1.3em;
      margin: var(--space-4) 0 var(--space-3);
      letter-spacing: 0.06em;
    }
    .panel-digits.shake { animation: shake 0.5s; color: var(--color-danger); }
    .panel-keypad { margin: 0 auto var(--space-3); }

    .panel-message {
      font-size: var(--font-lg);
      font-weight: 600;
      text-align: center;
      max-width: 340px;
      margin-bottom: var(--space-4);
    }

    .panel-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-1);
      width: 100%;
      max-width: 340px;
      margin-top: var(--space-3);
    }
    .panel-chips[hidden] { display: none; }

    input.panel-input {
      max-width: 340px;
      margin: var(--space-4) 0 var(--space-3);
      font-size: var(--font-lg);
      min-height: 56px;
    }
    /* The multi-line half of the same prompt. Body size, not --font-lg: a
       scope of work is a paragraph he reads back, and 1.4rem fits four words
       to a line on a phone. */
    textarea.panel-textarea {
      width: 100%;
      max-width: 340px;
      margin: var(--space-3) 0;
      font-family: var(--font);
      font-size: var(--font-body);
      line-height: 1.45;
      min-height: 200px;
      resize: vertical;
    }

    .panel-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      max-width: 340px;
      width: 100%;
      margin: auto auto 0;
    }
    .panel-center .panel-actions { margin: 0 auto; }
    /* The software keyboard covers the bottom of the viewport, so the text
       panel's Done/Cancel ride directly under the input instead. */
    #panel-text .panel-actions { margin: var(--space-3) auto 0; }
    .panel-actions .btn { width: 100%; }

    /* ---------- Short phones (iPhone SE, 375x667) ---------- */
    /* The keypad panel has to fit without scrolling: the whole point is that
       the thumb can reach every key without moving the phone. */
    @media (max-height: 700px) {
      .key { min-height: 60px; }
      .panel-digits {
        font-size: 2.2rem;
        margin: var(--space-2) 0 var(--space-2);
      }
      .panel-keypad { margin-bottom: var(--space-2); }
    }
  </style>
</head>
<body>
  <div class="chrome">
    <header id="topbar" class="topbar" hidden>
      <button type="button" id="backBtn" class="back-btn" hidden aria-label="Back">&#8249; Back</button>
      <h1 id="topbarTitle" class="topbar-title"></h1>
    </header>

    <div id="banner" class="banner-area" aria-live="polite"></div>
  </div>

  <main>
    <!-- ---------- PIN ---------- -->
    <section id="screen-pin" class="screen">
      <div class="pin-screen">
        <h1 class="app-name">CE Bids</h1>
        <p id="pinMessage" class="pin-message" aria-live="polite">Enter PIN</p>
        <div id="pinDots" class="pin-dots" aria-hidden="true">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <div id="pinKeypad" class="keypad">
          <button type="button" class="key" data-digit="1">1</button>
          <button type="button" class="key" data-digit="2">2</button>
          <button type="button" class="key" data-digit="3">3</button>
          <button type="button" class="key" data-digit="4">4</button>
          <button type="button" class="key" data-digit="5">5</button>
          <button type="button" class="key" data-digit="6">6</button>
          <button type="button" class="key" data-digit="7">7</button>
          <button type="button" class="key" data-digit="8">8</button>
          <button type="button" class="key" data-digit="9">9</button>
          <button type="button" class="key key-blank" tabindex="-1" aria-hidden="true" disabled></button>
          <button type="button" class="key" data-digit="0">0</button>
          <button type="button" class="key key-back" id="backspaceBtn" aria-label="Backspace">&#9003;</button>
        </div>
        <p id="pinHint" class="pin-hint" hidden></p>
        <!-- Only shown while Settings is changing the PIN: on the lock screen
             there is nowhere for a cancel to go. -->
        <button type="button" id="pinCancel" class="btn pin-cancel" hidden>Cancel</button>
      </div>
    </section>

    <!-- ---------- Bids (home) -- Task 6 ---------- -->
    <section id="screen-bids" class="screen" hidden>
      <div id="bidsContent" class="screen-content"></div>
    </section>

    <!-- ---------- Bid header form -- Task 7 ---------- -->
    <section id="screen-bid" class="screen" hidden>
      <div id="bidContent" class="screen-content"></div>
    </section>

    <!-- ---------- Walkthrough (areas, items, photos) -- Task 7 ---------- -->
    <section id="screen-walk" class="screen" hidden>
      <div id="walkContent" class="screen-content"></div>
      <!-- The camera, and the only native control in the app. It lives out
           here rather than inside #walkContent because the content is rebuilt
           on every render and the input is wired exactly once; `capture` asks
           iOS for the back camera straight away instead of the photo library,
           and iOS hands back a JPEG even on a phone that stores HEIC. -->
      <input type="file" id="walkPhotoInput" class="visually-hidden"
             accept="image/*" capture="environment" aria-hidden="true" tabindex="-1">
    </section>

    <!-- ---------- Labor -- Task 8 ---------- -->
    <section id="screen-labor" class="screen" hidden>
      <div id="laborContent" class="screen-content"></div>
    </section>

    <!-- ---------- Costs & price -- Task 9 ---------- -->
    <section id="screen-price" class="screen" hidden>
      <div id="priceContent" class="screen-content"></div>
    </section>

    <!-- ---------- Proposal -- Task 11 ---------- -->
    <section id="screen-proposal" class="screen" hidden>
      <!-- Filled entirely by screens/proposal.js. -->
      <div id="proposalContent" class="screen-content"></div>
    </section>

    <!-- ---------- Job (won bid) -- Task 12 ---------- -->
    <section id="screen-job" class="screen" hidden>
      <!-- Filled entirely by screens/job.js. -->
      <div id="jobContent" class="screen-content"></div>
    </section>

    <!-- ---------- Settings -- Task 13 ---------- -->
    <section id="screen-settings" class="screen" hidden>
      <!-- Filled entirely by screens/settings.js. -->
      <div id="settingsContent" class="screen-content"></div>
    </section>

    <!-- ---------- Reports -- Task 15 ---------- -->
    <section id="screen-reports" class="screen" hidden>
      <!-- Filled entirely by screens/reports.js. -->
      <div id="reportsContent" class="screen-content"></div>
    </section>
  </main>

  <nav id="tabbar" class="tabbar" hidden>
    <button type="button" class="tab" data-tab="bids">Bids</button>
    <button type="button" class="tab" data-tab="settings">Settings</button>
  </nav>

  <!-- ---------- Number keypad panel ---------- -->
  <!-- aria-describedby points at the caption even though it starts hidden: a
       hidden element is skipped by screen readers, so the description simply
       arrives with the caption instead of needing to be wired on and off. -->
  <div id="panel-keypad" class="panel-overlay" role="dialog" aria-modal="true" aria-labelledby="keypadLabel" aria-describedby="keypadCaption" hidden>
    <h2 id="keypadLabel" class="panel-title"></h2>
    <p id="keypadWas" class="panel-was"></p>
    <p id="keypadCaption" class="panel-caption" hidden></p>
    <div id="keypadDigits" class="panel-digits" aria-live="polite"></div>
    <div id="keypadGrid" class="keypad panel-keypad">
      <button type="button" class="key" data-digit="1">1</button>
      <button type="button" class="key" data-digit="2">2</button>
      <button type="button" class="key" data-digit="3">3</button>
      <button type="button" class="key" data-digit="4">4</button>
      <button type="button" class="key" data-digit="5">5</button>
      <button type="button" class="key" data-digit="6">6</button>
      <button type="button" class="key" data-digit="7">7</button>
      <button type="button" class="key" data-digit="8">8</button>
      <button type="button" class="key" data-digit="9">9</button>
      <!-- Shown only when the caller allows a decimal; blanked out otherwise so
           the 0 and backspace keys never move under the thumb. -->
      <button type="button" class="key key-blank" id="keypadDot" data-dot="1" tabindex="-1" aria-hidden="true" disabled>.</button>
      <button type="button" class="key" data-digit="0">0</button>
      <button type="button" class="key key-back" id="keypadBack" aria-label="Backspace">&#9003;</button>
    </div>
    <div class="panel-actions">
      <button type="button" id="keypadDone" class="btn btn-confirm">Done</button>
      <button type="button" id="keypadClear" class="btn">Clear</button>
      <button type="button" id="keypadCancel" class="btn">Cancel</button>
    </div>
  </div>

  <!-- ---------- Text panel ---------- -->
  <div id="panel-text" class="panel-overlay" role="dialog" aria-modal="true" aria-labelledby="textLabel" hidden>
    <h2 id="textLabel" class="panel-title"></h2>
    <!-- Names the owner has already used, when the caller passes any. Tapping
         one fills the input: typing the same customer twice, slightly
         differently, is how one customer becomes two. -->
    <div id="textChips" class="panel-chips" hidden></div>
    <input type="text" id="textInput" class="panel-input" autocomplete="off" autocorrect="off" spellcheck="false">
    <!-- The same prompt, for the one thing in this app that is a paragraph
         rather than a name: the scope of work. promptText({ multiline: true })
         shows this instead of the input above; exactly one of the two is ever
         visible. It keeps the dictation key on the iOS keyboard, which is how
         he is meant to write a scope standing in a plant. -->
    <textarea id="textArea" class="panel-input panel-textarea" rows="8" autocapitalize="sentences" hidden></textarea>
    <div class="panel-actions">
      <button type="button" id="textDone" class="btn btn-confirm">Done</button>
      <button type="button" id="textCancel" class="btn">Cancel</button>
    </div>
  </div>

  <!-- ---------- Confirm panel ---------- -->
  <div id="panel-confirm" class="panel-overlay panel-center" role="dialog" aria-modal="true" aria-labelledby="confirmMessage" hidden>
    <p id="confirmMessage" class="panel-message"></p>
    <div class="panel-actions">
      <button type="button" id="confirmOk" class="btn btn-primary">OK</button>
      <button type="button" id="confirmCancel" class="btn">Cancel</button>
    </div>
  </div>

  <!-- Pure logic first (bidmath, storage, docmodel, keypad, dates, catalog: no
       DOM, no clock, all unit-tested under node:test), then the browser-only
       stores, then the UI helpers, then the shell. Each screen registers itself with
       the shell, so every screen script must come after app.js. -->
  <script src="bidmath.js"></script>
  <!-- catalog.js before storage.js: Store.addCatalogItem straightens a part
       name through Catalog, so the module has to exist when storage.js runs. -->
  <script src="catalog.js"></script>
  <script src="storage.js"></script>
  <script src="docmodel.js"></script>
  <script src="keypad.js"></script>
  <script src="dates.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="photos.js"></script>
  <script src="docgen.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
  <script src="screens/bids.js"></script>
  <script src="screens/bid.js"></script>
  <script src="screens/walk.js"></script>
  <script src="screens/labor.js"></script>
  <script src="screens/price.js"></script>
  <script src="screens/proposal.js"></script>
  <script src="screens/job.js"></script>
  <script src="screens/settings.js"></script>
  <script src="screens/reports.js"></script>
</body>
</html>
